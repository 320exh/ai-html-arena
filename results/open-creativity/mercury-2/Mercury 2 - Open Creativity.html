<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coolest Single-File HTML Project</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    /* Full-screen gradient animation */
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .bg-animate {
      background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fad0c4, #ff9a9e);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }
    /* Simple particle canvas */
    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body class="bg-animate text-gray-900 antialiased relative overflow-hidden">
  <canvas id="particleCanvas"></canvas>
  <div class="flex items-center justify-center min-h-screen px-4">
    <div class="bg-white bg-opacity-80 backdrop-blur-sm rounded-xl shadow-xl p-8 max-w-md text-center">
      <h1 class="text-4xl font-bold mb-4 text-transparent bg-clip-text" style="background: linear-gradient(to right, #ff416c, #ff4b2b);">
        The Coolest Single-File Project
      </h1>
      <p class="mb-4 text-lg" id="quote">Loading a quote…</p>
      <button id="newQuoteBtn" class="mx-2 px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition">
        New Quote
      </button>
      <button id="themeBtn" class="mx-2 px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition">
        Change Background
      </button>
    </div>
  </div>
  <script>
    // Particle effect
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    const colors = ['#ff9a9e', '#fad0c4', '#ff416c', '#ff4b2b'];
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();
    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.radius = Math.random() * 2 + 1;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = (Math.random() - 0.5) * 0.5;
        this.color = colors[Math.floor(Math.random() * colors.length)];
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
          this.reset();
        }
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
      }
    }
    function initParticles(count) {
      particles = [];
      for (let i = 0; i < count; i++) {
        particles.push(new Particle());
      }
    }
    initParticles(150);
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const p of particles) {
        p.update();
        p.draw();
      }
      requestAnimationFrame(animate);
    }
    animate();

    // Quote fetching
    const quoteEl = document.getElementById('quote');
    async function fetchQuote() {
      try {
        const res = await fetch('https://api.quotable.io/random');
        const data = await res.json();
        quoteEl.textContent = `"${data.content}" — ${data.author}`;
      } catch (e) {
        quoteEl.textContent = 'Could not load quote.';
      }
    }
    document.getElementById('newQuoteBtn').addEventListener('click', fetchQuote);
    fetchQuote();

    // Background color change
    const themeBtn = document.getElementById('themeBtn');
    const body = document.body;
    themeBtn.addEventListener('click', () => {
      const hue = Math.floor(Math.random() * 360);
      const gradient = `linear-gradient(135deg, hsl(${hue},80%,70%), hsl(${(hue+60)%360},80%,70%))`;
      body.style.background = gradient;
    });
  </script>
</body>
</html>
