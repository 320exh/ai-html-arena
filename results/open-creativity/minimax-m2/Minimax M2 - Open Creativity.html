<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Nexus - Interactive Universe</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            background: #000;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        canvas {
            display: block;
        }

        .ui-overlay {
            position: fixed;
            z-index: 10;
            pointer-events: none;
        }

        .ui-overlay > * {
            pointer-events: auto;
        }

        .glow-text {
            text-shadow: 0 0 10px currentColor, 0 0 20px currentColor, 0 0 40px currentColor;
        }

        .glass {
            background: rgba(10, 10, 30, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(100, 200, 255, 0.2);
            box-shadow: 0 0 30px rgba(100, 200, 255, 0.1), inset 0 0 30px rgba(100, 200, 255, 0.05);
        }

        .neon-border {
            position: relative;
        }

        .neon-border::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(45deg, #0ff, #f0f, #0ff);
            border-radius: inherit;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .neon-border:hover::before {
            opacity: 1;
            animation: borderGlow 2s linear infinite;
        }

        @keyframes borderGlow {
            0%, 100% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.1) 2px,
                rgba(0, 0, 0, 0.1) 4px
            );
        }

        .pulse-ring {
            animation: pulseRing 2s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
        }

        @keyframes pulseRing {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }

        .float-animation {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .stats-bar {
            transition: all 0.3s ease;
        }

        .stats-bar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(100, 200, 255, 0.3);
        }

        .mode-btn {
            transition: all 0.3s ease;
        }

        .mode-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(100, 200, 255, 0.4);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #0ff, #f0f);
            color: #000;
            font-weight: 700;
        }

        .particle-trail {
            position: fixed;
            width: 4px;
            height: 4px;
            background: #0ff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 50;
            opacity: 0;
        }

        @keyframes trailFade {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0); }
        }

        .hologram {
            animation: hologram 4s ease-in-out infinite;
        }

        @keyframes hologram {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        input[type="range"] {
            -webkit-appearance: none;
            background: linear-gradient(90deg, #0ff, #f0f);
            height: 4px;
            border-radius: 2px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 20px #0ff;
        }

        .constellation-line {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawLine 2s ease forwards;
        }

        @keyframes drawLine {
            to { stroke-dashoffset: 0; }
        }

        .title-reveal {
            animation: titleReveal 2s ease forwards;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0% 100%);
        }

        @keyframes titleReveal {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #0ff;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            color: #0ff;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            white-space: nowrap;
            z-index: 1000;
        }

        .tooltip.visible {
            opacity: 1;
        }

        .loading-screen {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .loading-bar {
            width: 300px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #0ff, #f0f);
            width: 0%;
            transition: width 0.3s;
        }

        @keyframes rotate3d {
            from { transform: rotateX(0deg) rotateY(0deg); }
            to { transform: rotateX(360deg) rotateY(360deg); }
        }
    </style>
</head>
<body class="bg-black text-white">
    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="text-6xl mb-8 font-['Orbitron'] font-black glow-text text-cyan-400">
            COSMIC NEXUS
        </div>
        <div class="loading-bar">
            <div class="loading-progress" id="loadingProgress"></div>
        </div>
        <div class="mt-4 text-cyan-300 font-['Rajdhani'] text-xl" id="loadingText">Initializing quantum core...</div>
    </div>

    <!-- Scanlines -->
    <div class="scanline"></div>

    <!-- Canvas -->
    <div id="canvas-container">
        <canvas id="mainCanvas"></canvas>
    </div>

    <!-- UI Overlay -->
    <div class="ui-overlay inset-0 p-4">
        <!-- Top Bar -->
        <div class="flex justify-between items-start">
            <div class="glass rounded-2xl p-4 neon-border">
                <h1 class="font-['Orbitron'] font-black text-2xl md:text-4xl glow-text text-cyan-400 title-reveal">
                    COSMIC NEXUS
                </h1>
                <p class="text-cyan-300/70 text-sm mt-1">Interactive Quantum Universe</p>
            </div>

            <div class="glass rounded-2xl p-4 neon-border">
                <div class="flex gap-4 text-xs">
                    <div class="text-center">
                        <div class="text-purple-400 font-['Orbitron'] font-bold" id="particleCount">0</div>
                        <div class="text-gray-400">Particles</div>
                    </div>
                    <div class="text-center">
                        <div class="text-cyan-400 font-['Orbitron'] font-bold" id="fpsCounter">60</div>
                        <div class="text-gray-400">FPS</div>
                    </div>
                    <div class="text-center">
                        <div class="text-pink-400 font-['Orbitron'] font-bold" id="modeDisplay">ATTRACT</div>
                        <div class="text-gray-400">Mode</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Left Panel - Controls -->
        <div class="absolute left-4 top-1/2 -translate-y-1/2 glass rounded-2xl p-4 neon-border w-64">
            <h3 class="font-['Orbitron'] font-bold text-lg text-cyan-400 mb-4 flex items-center gap-2">
                <span class="w-2 h-2 bg-cyan-400 rounded-full animate-pulse"></span>
                CONTROL MATRIX
            </h3>
            
            <div class="space-y-4">
                <div>
                    <label class="text-gray-400 text-sm block mb-2">Particle Count</label>
                    <input type="range" min="100" max="3000" value="1500" class="w-full" id="particleSlider">
                </div>
                <div>
                    <label class="text-gray-400 text-sm block mb-2">Particle Size</label>
                    <input type="range" min="1" max="10" value="3" class="w-full" id="sizeSlider">
                </div>
                <div>
                    <label class="text-gray-400 text-sm block mb-2">Speed</label>
                    <input type="range" min="1" max="20" value="5" class="w-full" id="speedSlider">
                </div>
                <div>
                    <label class="text-gray-400 text-sm block mb-2">Trail Length</label>
                    <input type="range" min="0" max="50" value="20" class="w-full" id="trailSlider">
                </div>
                <div>
                    <label class="text-gray-400 text-sm block mb-2">Glow Intensity</label>
                    <input type="range" min="0" max="100" value="50" class="w-full" id="glowSlider">
                </div>
            </div>
        </div>

        <!-- Right Panel - Mode Selection -->
        <div class="absolute right-4 top-1/2 -translate-y-1/2 glass rounded-2xl p-4 neon-border">
            <h3 class="font-['Orbitron'] font-bold text-lg text-purple-400 mb-4 flex items-center gap-2">
                <span class="w-2 h-2 bg-purple-400 rounded-full animate-pulse"></span>
                INTERACTION MODES
            </h3>
            
            <div class="space-y-2">
                <button class="mode-btn active w-full py-3 px-4 glass rounded-xl text-left font-['Orbitron'] font-bold text-sm" data-mode="attract">
                    🌀 ATTRACT
                </button>
                <button class="mode-btn w-full py-3 px-4 glass rounded-xl text-left font-['Orbitron'] font-bold text-sm" data-mode="repel">
                    💥 REPEL
                </button>
                <button class="mode-btn w-full py-3 px-4 glass rounded-xl text-left font-['Orbitron'] font-bold text-sm" data-mode="swirl">
                    🌀 SWIRL
                </button>
                <button class="mode-btn w-full py-3 px-4 glass rounded-xl text-left font-['Orbitron'] font-bold text-sm" data-mode="gravity">
                    🌑 GRAVITY
                </button>
                <button class="mode-btn w-full py-3 px-4 glass rounded-xl text-left font-['Orbitron'] font-bold text-sm" data-mode="quantum">
                    ⚛️ QUANTUM
                </button>
                <button class="mode-btn w-full py-3 px-4 glass rounded-xl text-left font-['Orbitron'] font-bold text-sm" data-mode="galaxy">
                    🌌 GALAXY
                </button>
            </div>
        </div>

        <!-- Bottom Bar -->
        <div class="absolute bottom-4 left-1/2 -translate-x-1/2 glass rounded-2xl p-4 neon-border">
            <div class="flex gap-6 text-xs">
                <div class="stats-bar glass rounded-lg p-3 cursor-pointer hover:bg-white/10" onclick="resetParticles()">
                    <div class="text-green-400 font-['Orbitron'] font-bold">⟳ RESET</div>
                </div>
                <div class="stats-bar glass rounded-lg p-3 cursor-pointer hover:bg-white/10" onclick="toggleSound()">
                    <div class="text-yellow-400 font-['Orbitron'] font-bold" id="soundToggle">🔊 SOUND</div>
                </div>
                <div class="stats-bar glass rounded-lg p-3 cursor-pointer hover:bg-white/10" onclick="toggleAutoRotate()">
                    <div class="text-blue-400 font-['Orbitron'] font-bold" id="rotateToggle">↻ AUTO-ROTATE</div>
                </div>
                <div class="stats-bar glass rounded-lg p-3 cursor-pointer hover:bg-white/10" onclick="captureScreenshot()">
                    <div class="text-pink-400 font-['Orbitron'] font-bold">📸 CAPTURE</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip"></div>

    <script>
        // ==================== INITIALIZATION ====================
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        let mouse = { x: 0, y: 0, active: false };
        let currentMode = 'attract';
        let autoRotate = true;
        let soundEnabled = false;
        let rotationAngle = 0;
        let lastTime = 0;
        let frameCount = 0;
        let fps = 60;

        // Settings
        let settings = {
            particleCount: 1500,
            particleSize: 3,
            speed: 5,
            trailLength: 20,
            glowIntensity: 50
        };

        // Colors
        const colors = {
            cyan: '#00ffff',
            magenta: '#ff00ff',
            purple: '#8b5cf6',
            pink: '#ec4899',
            blue: '#3b82f6',
            green: '#10b981'
        };

        const colorPalette = [colors.cyan, colors.magenta, colors.purple, colors.pink, colors.blue, colors.green];

        // ==================== RESIZE ====================
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        // ==================== PARTICLE CLASS ====================
        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.baseVx = this.vx;
                this.baseVy = this.vy;
                this.size = Math.random() * settings.particleSize + 1;
                this.color = colorPalette[Math.floor(Math.random() * colorPalette.length)];
                this.alpha = Math.random() * 0.5 + 0.5;
                this.angle = Math.random() * Math.PI * 2;
                this.radius = Math.random() * 200 + 50;
                this.speed = Math.random() * 2 + 1;
                this.glow = Math.random();
            }

            update() {
                const speedMultiplier = settings.speed / 5;
                
                switch(currentMode) {
                    case 'attract':
                        this.attract();
                        break;
                    case 'repel':
                        this.repel();
                        break;
                    case 'swirl':
                        this.swirl();
                        break;
                    case 'gravity':
                        this.gravity();
                        break;
                    case 'quantum':
                        this.quantum();
                        break;
                    case 'galaxy':
                        this.galaxy();
                        break;
                }

                // Apply velocity
                this.x += this.vx * speedMultiplier;
                this.y += this.vy * speedMultiplier;

                // Boundary wrap
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                // Rotation for auto-rotate mode
                if (autoRotate) {
                    const dx = this.x - width / 2;
                    const dy = this.y - height / 2;
                    const cos = Math.cos(rotationAngle * 0.01);
                    const sin = Math.sin(rotationAngle * 0.01);
                    this.x = width / 2 + dx * cos - dy * sin;
                    this.y = height / 2 + dx * sin + dy * cos;
                }

                // Glow pulsing
                this.glow = (this.glow + 0.02) % 1;
            }

            attract() {
                if (!mouse.active) {
                    this.vx += (this.baseVx - this.vx) * 0.02;
                    this.vy += (this.baseVy - this.vy) * 0.02;
                    return;
                }

                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist > 0 && dist < 500) {
                    const force = (500 - dist) / 500;
                    this.vx += (dx / dist) * force * 0.5;
                    this.vy += (dy / dist) * force * 0.5;
                }

                // Damping
                this.vx *= 0.98;
                this.vy *= 0.98;
            }

            repel() {
                if (!mouse.active) {
                    this.vx += (this.baseVx - this.vx) * 0.02;
                    this.vy += (this.baseVy - this.vy) * 0.02;
                    return;
                }

                const dx = this.x - mouse.x;
                const dy = this.y - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist > 0 && dist < 400) {
                    const force = (400 - dist) / 400;
                    this.vx += (dx / dist) * force * 2;
                    this.vy += (dy / dist) * force * 2;
                }

                this.vx *= 0.98;
                this.vy *= 0.98;
            }

            swirl() {
                if (!mouse.active) {
                    this.angle += 0.02;
                    const centerX = width / 2;
                    const centerY = height / 2;
                    const targetX = centerX + Math.cos(this.angle) * this.radius;
                    const targetY = centerY + Math.sin(this.angle) * this.radius;
                    
                    this.vx += (targetX - this.x) * 0.01;
                    this.vy += (targetY - this.y) * 0.01;
                } else {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    this.vx += dy * 0.01;
                    this.vy -= dx * 0.01;
                }

                this.vx *= 0.99;
                this.vy *= 0.99;
            }

            gravity() {
                const centerX = width / 2;
                const centerY = height / 2;
                const dx = centerX - this.x;
                const dy = centerY - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist > 50) {
                    const force = 1000 / (dist * dist);
                    this.vx += (dx / dist) * force;
                    this.vy += (dy / dist) * force;
                }

                if (mouse.active) {
                    const mdx = mouse.x - this.x;
                    const mdy = mouse.y - this.y;
                    const mdist = Math.sqrt(mdx * mdx + mdy * mdy);
                    if (mdist > 0 && mdist < 300) {
                        const mforce = (300 - mdist) / 300;
                        this.vx -= (mdx / mdist) * mforce * 0.5;
                        this.vy -= (mdy / mdist) * mforce * 0.5;
                    }
                }

                this.vx *= 0.995;
                this.vy *= 0.995;
            }

            quantum() {
                // Random quantum jumps
                if (Math.random() < 0.01) {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                }

                // Attract to mouse with uncertainty
                if (mouse.active) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist > 0 && dist < 400) {
                        const uncertainty = Math.random() * 0.3 + 0.7;
                        this.vx += (dx / dist) * 0.3 * uncertainty;
                        this.vy += (dy / dist) * 0.3 * uncertainty;
                    }
                }

                // Maintain some chaos
                this.vx += (Math.random() - 0.5) * 0.5;
                this.vy += (Math.random() - 0.5) * 0.5;

                this.vx *= 0.95;
                this.vy *= 0.95;
            }

            galaxy() {
                const centerX = width / 2;
                const centerY = height / 2;
                const dx = this.x - centerX;
                const dy = this.y - centerY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const angle = Math.atan2(dy, dx);

                // Spiral motion
                const spiralAngle = angle + 0.02;
                const targetRadius = Math.min(dist, 300);
                
                if (dist > 0) {
                    const tangentX = -Math.sin(angle);
                    const tangentY = Math.cos(angle);
                    
                    this.vx += tangentX * 0.3;
                    this.vy += tangentY * 0.3;
                    
                    // Pull toward center
                    this.vx -= (dx / dist) * 0.1;
                    this.vy -= (dy / dist) * 0.1;
                }

                if (mouse.active) {
                    const mdx = mouse.x - this.x;
                    const mdy = mouse.y - this.y;
                    const mdist = Math.sqrt(mdx * mdx + mdy * mdy);
                    if (mdist > 0 && mdist < 200) {
                        this.vx += (mdx / mdist) * 0.5;
                        this.vy += (mdy / mdist) * 0.5;
                    }
                }

                this.vx *= 0.98;
                this.vy *= 0.98;
            }

            draw() {
                const glowSize = settings.glowIntensity / 50;
                const alpha = this.alpha * (0.5 + this.glow * 0.5);
                
                // Glow effect
                const gradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.size * 3 * glowSize
                );
                gradient.addColorStop(0, this.color + Math.floor(alpha * 255).toString(16).padStart(2, '0'));
                gradient.addColorStop(0.5, this.color + Math.floor(alpha * 128).toString(16).padStart(2, '0'));
                gradient.addColorStop(1, 'transparent');

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 3 * glowSize, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                // Core
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        // ==================== CREATE PARTICLES ====================
        function createParticles() {
            particles = [];
            for (let i = 0; i < settings.particleCount; i++) {
                particles.push(new Particle());
            }
            updateParticleCount();
        }

        // ==================== DRAW CONNECTIONS ====================
        function drawConnections() {
            const maxDist = 100;
            
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < maxDist) {
                        const alpha = (1 - dist / maxDist) * 0.3;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        
                        const gradient = ctx.createLinearGradient(
                            particles[i].x, particles[i].y,
                            particles[j].x, particles[j].y
                        );
                        gradient.addColorStop(0, particles[i].color + Math.floor(alpha * 255).toString(16).padStart(2, '0'));
                        gradient.addColorStop(1, particles[j].color + Math.floor(alpha * 255).toString(16).padStart(2, '0'));
                        
                        ctx.strokeStyle = gradient;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
        }

        // ==================== DRAW MOUSE CONNECTION ====================
        function drawMouseConnections() {
            if (!mouse.active) return;
            
            const maxDist = 200;
            
            for (let particle of particles) {
                const dx = particle.x - mouse.x;
                const dy = particle.y - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < maxDist) {
                    const alpha = (1 - dist / maxDist) * 0.5;
                    ctx.beginPath();
                    ctx.moveTo(particle.x, particle.y);
                    ctx.lineTo(mouse.x, mouse.y);
                    ctx.strokeStyle = `rgba(0, 255, 255, ${alpha})`;
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }
        }

        // ==================== BACKGROUND ====================
        function drawBackground() {
            // Dark gradient background
            const gradient = ctx.createRadialGradient(
                width / 2, height / 2, 0,
                width / 2, height / 2, Math.max(width, height)
            );
            gradient.addColorStop(0, 'rgba(10, 10, 30, 1)');
            gradient.addColorStop(0.5, 'rgba(5, 5, 20, 1)');
            gradient.addColorStop(1, 'rgba(0, 0, 10, 1)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // Subtle grid
            ctx.strokeStyle = 'rgba(100, 200, 255, 0.03)';
            ctx.lineWidth = 1;
            const gridSize = 50;
            
            for (let x = 0; x < width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            
            for (let y = 0; y < height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
        }

        // ==================== MAIN LOOP ====================
        function animate(timestamp) {
            // FPS calculation
            frameCount++;
            if (timestamp - lastTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastTime = timestamp;
                updateFPS();
            }

            // Clear and draw background
            drawBackground();

            // Update rotation
            if (autoRotate) {
                rotationAngle += 0.5;
            }

            // Draw connections
            drawConnections();
            drawMouseConnections();

            // Update and draw particles
            for (let particle of particles) {
                particle.update();
                particle.draw();
            }

            // Draw center glow
            const centerGlow = ctx.createRadialGradient(
                width / 2, height / 2, 0,
                width / 2, height / 2, 300
            );
            centerGlow.addColorStop(0, 'rgba(139, 92, 246, 0.1)');
            centerGlow.addColorStop(0.5, 'rgba(139, 92, 246, 0.05)');
            centerGlow.addColorStop(1, 'transparent');
            ctx.fillStyle = centerGlow;
            ctx.fillRect(0, 0, width, height);

            requestAnimationFrame(animate);
        }

        // ==================== EVENT LISTENERS ====================
        canvas.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.active = true;
        });

        canvas.addEventListener('mouseleave', () => {
            mouse.active = false;
        });

        canvas.addEventListener('click', (e) => {
            createParticleBurst(e.clientX, e.clientY);
        });

        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
            mouse.active = true;
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        });

        canvas.addEventListener('touchend', () => {
            mouse.active = false;
        });

        // Mode buttons
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
                updateModeDisplay();
            });
        });

        // Sliders
        document.getElementById('particleSlider').addEventListener('input', (e) => {
            settings.particleCount = parseInt(e.target.value);
            createParticles();
        });

        document.getElementById('sizeSlider').addEventListener('input', (e) => {
            settings.particleSize = parseInt(e.target.value);
        });

        document.getElementById('speedSlider').addEventListener('input', (e) => {
            settings.speed = parseInt(e.target.value);
        });

        document.getElementById('trailSlider').addEventListener('input', (e) => {
            settings.trailLength = parseInt(e.target.value);
        });

        document.getElementById('glowSlider').addEventListener('input', (e) => {
            settings.glowIntensity = parseInt(e.target.value);
        });

        // ==================== FUNCTIONS ====================
        function createParticleBurst(x, y) {
            for (let i = 0; i < 50; i++) {
                const angle = (Math.PI * 2 / 50) * i;
                const speed = Math.random() * 5 + 2;
                const burstParticle = new Particle();
                burstParticle.x = x;
                burstParticle.y = y;
                burstParticle.vx = Math.cos(angle) * speed;
                burstParticle.vy = Math.sin(angle) * speed;
                particles.push(burstParticle);
            }
            
            // Remove old particles if too many
            if (particles.length > settings.particleCount + 500) {
                particles.splice(0, 50);
            }
        }

        function resetParticles() {
            createParticles();
            rotationAngle = 0;
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundToggle').textContent = soundEnabled ? '🔇 MUTE' : '🔊 SOUND';
        }

        function toggleAutoRotate() {
            autoRotate = !autoRotate;
            document.getElementById('rotateToggle').textContent = autoRotate ? '↻ AUTO-ROTATE' : '⏸ PAUSE ROTATE';
        }

        function captureScreenshot() {
            const link = document.createElement('a');
            link.download = 'cosmic-nexus-' + Date.now() + '.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        function updateParticleCount() {
            document.getElementById('particleCount').textContent = particles.length;
        }

        function updateFPS() {
            document.getElementById('fpsCounter').textContent = fps;
        }

        function updateModeDisplay() {
            const modeNames = {
                attract: 'ATTRACT',
                repel: 'REPEL',
                swirl: 'SWIRL',
                gravity: 'GRAVITY',
                quantum: 'QUANTUM',
                galaxy: 'GALAXY'
            };
            document.getElementById('modeDisplay').textContent = modeNames[currentMode];
        }

        // ==================== LOADING ====================
        let loadProgress = 0;
        const loadingTexts = [
            'Initializing quantum core...',
            'Generating particle matrix...',
            'Calibrating gravity wells...',
            'Loading stellar cartography...',
            'Preparing cosmic interface...'
        ];

        function simulateLoading() {
            const progress = document.getElementById('loadingProgress');
            const text = document.getElementById('loadingText');
            
            loadProgress += Math.random() * 20 + 5;
            
            if (loadProgress > 100) loadProgress = 100;
            
            progress.style.width = loadProgress + '%';
            
            const textIndex = Math.floor((loadProgress / 100) * (loadingTexts.length - 1));
            text.textContent = loadingTexts[textIndex];
            
            if (loadProgress >= 100) {
                setTimeout(() => {
                    document.getElementById('loadingScreen').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('loadingScreen').style.display = 'none';
                    }, 500);
                }, 500);
                return;
            }
            
            setTimeout(simulateLoading, 300);
        }

        // ==================== KEYBOARD SHORTCUTS ====================
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case '1':
                    document.querySelector('[data-mode="attract"]').click();
                    break;
                case '2':
                    document.querySelector('[data-mode="repel"]').click();
                    break;
                case '3':
                    document.querySelector('[data-mode="swirl"]').click();
                    break;
                case '4':
                    document.querySelector('[data-mode="gravity"]').click();
                    break;
                case '5':
                    document.querySelector('[data-mode="quantum"]').click();
                    break;
                case '6':
                    document.querySelector('[data-mode="galaxy"]').click();
                    break;
                case 'r':
                case 'R':
                    resetParticles();
                    break;
                case ' ':
                    e.preventDefault();
                    toggleAutoRotate();
                    break;
            }
        });

        // ==================== START ====================
        simulateLoading();
        createParticles();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
