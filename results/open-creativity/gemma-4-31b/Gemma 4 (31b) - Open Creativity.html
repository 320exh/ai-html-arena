<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUANTUM NEXUS // Generative Reality</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&family=JetBrains+Mono:wght@300;500&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background: #020617;
            font-family: 'Space Grotesk', sans-serif;
            color: #f8fafc;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .hud-overlay {
            position: relative;
            z-index: 10;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        .glow-text {
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.8), 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(56, 189, 248, 0.1);
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            animation: scan 8s linear infinite;
            z-index: 20;
        }

        @keyframes scan {
            0% { top: -10%; }
            100% { top: 110%; }
        }

        .nexus-border {
            position: fixed;
            inset: 20px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            pointer-events: none;
            z-index: 5;
        }

        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px #38bdf8;
        }
    </style>
</head>
<body>

    <div class="scanline"></div>
    <div class="nexus-border"></div>

    <div class="hud-overlay h-screen w-screen flex flex-col justify-between p-6 md:p-12">
        <!-- Top Header -->
        <div class="flex justify-between items-start">
            <div class="interactive">
                <h1 class="text-4xl font-bold tracking-tighter glow-text italic uppercase">Quantum Nexus</h1>
                <p class="mono text-xs opacity-60">STATUS: SYNCHRONIZED // DIMENSION: 4D-HYPERSPACE</p>
            </div>
            <div class="interactive glass p-4 rounded-lg mono text-[10px] space-y-1">
                <div class="flex justify-between gap-8">
                    <span>CORE TEMP:</span> <span id="core-temp" class="text-sky-400">4,200K</span>
                </div>
                <div class="flex justify-between gap-8">
                    <span>ENTROPY:</span> <span id="entropy" class="text-sky-400">0.00012%</span>
                </div>
                <div class="flex justify-between gap-8">
                    <span>STABILITY:</span> <span id="stability" class="text-sky-400">99.9%</span>
                </div>
            </div>
        </div>

        <!-- Bottom Controls -->
        <div class="flex flex-col md:flex-row justify-between items-end gap-6">
            <div class="interactive glass p-6 rounded-2xl max-w-sm w-full space-y-6">
                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <label class="mono text-xs uppercase opacity-70">Geometry Complexity</label>
                        <span id="geom-val" class="mono text-xs text-sky-400">128</span>
                    </div>
                    <input type="range" id="geom-slider" min="32" max="512" value="128" class="w-full">
                </div>

                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <label class="mono text-xs uppercase opacity-70">Energy Flux</label>
                        <span id="flux-val" class="mono text-xs text-sky-400">1.0</span>
                    </div>
                    <input type="range" id="flux-slider" min="0.1" max="3.0" step="0.1" value="1.0" class="w-full">
                </div>

                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <label class="mono text-xs uppercase opacity-70">Chromatic Shift</label>
                        <span id="color-val" class="mono text-xs text-sky-400">Cyan</span>
                    </div>
                    <input type="range" id="color-slider" min="0" max="360" value="190" class="w-full">
                </div>
            </div>

            <div class="interactive flex gap-4">
                <button id="reset-btn" class="glass px-6 py-3 rounded-full mono text-xs uppercase hover:bg-sky-500/20 transition-colors border-sky-500/50">
                    Recalibrate
                </button>
                <button id="warp-btn" class="glass px-6 py-3 rounded-full mono text-xs uppercase hover:bg-purple-500/20 transition-colors border-purple-500/50">
                    Hyper-Jump
                </button>
            </div>
        </div>
    </div>

    <script>
        /**
         * THE QUANTUM NEXUS ENGINE
         */
        
        let scene, camera, renderer, core, particles, points;
        let targetRotationX = 0.005, targetRotationY = 0.005;
        let currentFlux = 1.0;
        let currentHue = 190;

        function init() {
            // Scene Setup
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // Quantum Core - A complex polyhedral structure
            const geometry = new THREE.IcosahedronGeometry(2, 1);
            const material = new THREE.MeshPhongMaterial({
                color: 0x38bdf8,
                wireframe: true,
                transparent: true,
                opacity: 0.4,
                emissive: 0x0ea5e9,
                emissiveIntensity: 2
            });
            core = new THREE.Mesh(geometry, material);
            scene.add(core);

            // Particle Field
            const pCount = 2000;
            const pGeometry = new THREE.BufferGeometry();
            const pPos = new Float32Array(pCount * 3);
            const pColors = new Float32Array(pCount * 3);

            for(let i=0; i<pCount * 3; i++) {
                pPos[i] = (Math.random() - 0.5) * 15;
                pColors[i] = Math.random();
            }

            pGeometry.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
            pGeometry.setAttribute('color', new THREE.BufferAttribute(pColors, 3));

            const pMaterial = new THREE.PointsMaterial({
                size: 0.02,
                vertexColors: true,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            });

            particles = new THREE.Points(pGeometry, pMaterial);
            scene.add(particles);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 2);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0x38bdf8, 5, 10);
            pointLight.position.set(2, 2, 2);
            scene.add(pointLight);

            const pointLight2 = new THREE.PointLight(0x818cf8, 5, 10);
            pointLight2.position.set(-2, -2, 2);
            scene.add(pointLight2);

            // Interaction
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('mousemove', onMouseMove);
            
            setupControls();
            animate();
        }

        function setupControls() {
            const geomSlider = document.getElementById('geom-slider');
            const fluxSlider = document.getElementById('flux-slider');
            const colorSlider = document.getElementById('color-slider');
            const resetBtn = document.getElementById('reset-btn');
            const warpBtn = document.getElementById('warp-btn');

            geomSlider.oninput = (e) => {
                const val = parseInt(e.target.value);
                document.getElementById('geom-val').innerText = val;
                
                // Dynamically rebuild core geometry for "complexity"
                core.geometry.dispose();
                core.geometry = new THREE.IcosahedronGeometry(2, Math.floor(val/64));
            };

            fluxSlider.oninput = (e) => {
                currentFlux = parseFloat(e.target.value);
                document.getElementById('flux-val').innerText = currentFlux.toFixed(1);
            };

            colorSlider.oninput = (e) => {
                currentHue = parseInt(e.target.value);
                const color = new THREE.Color(`hsl(${currentHue}, 100%, 50%)`);
                core.material.color.copy(color);
                core.material.emissive.copy(color);
                document.getElementById('color-val').innerText = getColorName(currentHue);
            };

            resetBtn.onclick = () => {
                gsap.to(core.rotation, { x: 0, y: 0, z: 0, duration: 2, ease: "expo.out" });
                gsap.to(camera.position, { z: 5, duration: 2, ease: "expo.out" });
            };

            warpBtn.onclick = () => {
                gsap.to(core.rotation, { 
                    x: Math.random() * 10, 
                    y: Math.random() * 10, 
                    z: Math.random() * 10, 
                    duration: 1.5, 
                    ease: "power4.inOut" 
                });
                gsap.to(camera.position, { 
                    z: 2, 
                    duration: 0.8, 
                    yoyo: true, 
                    repeat: 1, 
                    ease: "back.inOut" 
                });
            };
        }

        function getColorName(hue) {
            if (hue < 30) return "Red";
            if (hue < 60) return "Yellow";
            if (hue < 150) return "Green";
            if (hue < 210) return "Cyan";
            if (hue < 270) return "Blue";
            if (hue < 330) return "Purple";
            return "Magenta";
        }

        function onMouseMove(e) {
            const x = (e.clientX / window.innerWidth) - 0.5;
            const y = (e.clientY / window.innerHeight) - 0.5;
            
            targetRotationY = x * 0.05;
            targetRotationX = y * 0.05;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function updateHUD() {
            document.getElementById('core-temp').innerText = `${(4000 + Math.random() * 500).toFixed(0)}K`;
            document.getElementById('entropy').innerText = `${(Math.random() * 0.001).toFixed(5)}%`;
            document.getElementById('stability').innerText = `${(99 + Math.random()).toFixed(2)}%`;
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.001;

            // Core rotation
            core.rotation.x += (targetRotationX + 0.002) * currentFlux;
            core.rotation.y += (targetRotationY + 0.002) * currentFlux;
            
            // Subtle pulse
            const scale = 1 + Math.sin(time * 2) * 0.05 * currentFlux;
            core.scale.set(scale, scale, scale);

            // Particle movement
            particles.rotation.y += 0.001 * currentFlux;
            particles.rotation.x += 0.0005 * currentFlux;

            // Dynamic HUD updates
            if(Math.random() > 0.95) updateHUD();

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
