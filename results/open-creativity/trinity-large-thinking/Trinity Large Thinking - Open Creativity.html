<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Particle Dreamscape</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }
        .neon-text {
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5), 0 0 20px rgba(0, 255, 255, 0.3);
        }
        .control-panel {
            transition: transform 0.3s ease;
        }
        .control-panel:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="ui" class="flex flex-col justify-between p-6">
        <!-- Header -->
        <header class="flex justify-between items-start">
            <div>
                <h1 class="text-4xl font-bold neon-text mb-2">Particle Dreamscape</h1>
                <p class="text-gray-300 text-sm">Interactive 3D particle system with custom shaders</p>
            </div>
            <div class="glass px-4 py-2 control-panel">
                <span class="text-xs text-gray-400">FPS: <span id="fps">60</span></span>
            </div>
        </header>
        
        <!-- Controls -->
        <div class="absolute bottom-6 left-6 right-6">
            <div class="glass p-6 rounded-2xl control-panel max-w-md">
                <h3 class="text-xl font-semibold mb-4 text-white">Controls</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm text-gray-300 mb-2">Particle Count</label>
                        <input type="range" id="particleCount" min="1000" max="20000" value="10000" class="w-full accent-cyan-400">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-300 mb-2">Speed</label>
                        <input type="range" id="speed" min="0.1" max="2" step="0.1" value="0.5" class="w-full accent-cyan-400">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-300 mb-2">Color Shift</label>
                        <input type="range" id="colorShift" min="0" max="1" step="0.01" value="0.5" class="w-full accent-cyan-400">
                    </div>
                    <div class="flex items-center justify-between pt-2">
                        <button id="toggleRotation" class="px-4 py-2 bg-cyan-500 hover:bg-cyan-600 text-white rounded-lg transition-colors">
                            Pause Rotation
                        </button>
                        <button id="resetView" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg transition-colors">
                            Reset View
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Footer -->
        <footer class="flex justify-between items-end">
            <div class="text-xs text-gray-500">
                <p>Drag to rotate • Scroll to zoom • Move mouse to influence particles</p>
            </div>
            <div class="glass px-4 py-2 text-xs text-gray-300">
                <p>Three.js + Custom Shaders</p>
            </div>
        </footer>
    </div>

    <script>
        // Three.js setup
        const canvas = document.getElementById('canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x000000, 10, 100);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 30;
        
        // Particle system with custom shader
        const particleCount = 10000;
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const sizes = new Float32Array(particleCount);
        const randomness = new Float32Array(particleCount);
        
        // Initialize particles
        for (let i = 0; i < particleCount; i++) {
            const i3 = i * 3;
            positions[i3] = (Math.random() - 0.5) * 100;
            positions[i3 + 1] = (Math.random() - 0.5) * 100;
            positions[i3 + 2] = (Math.random() - 0.5) * 100;
            
            colors[i3] = Math.random();
            colors[i3 + 1] = Math.random();
            colors[i3 + 2] = Math.random();
            
            sizes[i] = Math.random() * 2;
            randomness[i] = Math.random();
        }
        
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
        geometry.setAttribute('aRandom', new THREE.BufferAttribute(randomness, 1));
        
        // Custom shader material
        const material = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                colorShift: { value: 0.5 },
                speed: { value: 0.5 },
                mouse: { value: new THREE.Vector2(0, 0) },
                cameraPos: { value: camera.position }
            },
            vertexShader: `
                uniform float time;
                uniform float colorShift;
                uniform float speed;
                uniform vec2 mouse;
                uniform vec3 cameraPos;
                attribute float size;
                attribute float aRandom;
                attribute vec3 color;
                varying vec3 vColor;
                varying float vDistance;
                
                void main() {
                    vColor = color;
                    
                    vec3 pos = position;
                    
                    // Animate particles in a wave pattern
                    float wave = sin(pos.x * 0.1 + time * speed) * 2.0;
                    wave += cos(pos.y * 0.1 + time * speed) * 2.0;
                    wave += sin(pos.z * 0.1 + time * speed) * 2.0;
                    
                    pos += normalize(pos) * wave * 0.5;
                    
                    // Mouse influence
                    float mouseDist = distance(pos.xy, mouse * 20.0);
                    float influence = smoothstep(10.0, 0.0, mouseDist);
                    pos.xy += normalize(pos.xy - mouse * 20.0) * influence * 5.0;
                    
                    // Rotate entire system
                    float angle = time * 0.1;
                    mat2 rotation = mat2(cos(angle), -sin(angle), sin(angle), cos(angle));
                    pos.xz = rotation * pos.xz;
                    
                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                    
                    // Distance from camera for fog
                    vDistance = -mvPosition.z;
                    
                    // Size attenuation
                    gl_PointSize = size * (30.0 / -mvPosition.z);
                }
            `,
            fragmentShader: `
                uniform float time;
                uniform float colorShift;
                varying vec3 vColor;
                varying float vDistance;
                
                void main() {
                    // Circular particle shape
                    float r = distance(gl_PointCoord, vec2(0.5));
                    if (r > 0.5) discard;
                    
                    // Soft glow effect
                    float glow = 1.0 - (r * 2.0);
                    glow = pow(glow, 2.0);
                    
                    // Dynamic color based on time and colorShift
                    vec3 baseColor = vColor;
                    vec3 timeColor = vec3(
                        sin(time * 0.5 + colorShift * 6.28) * 0.5 + 0.5,
                        cos(time * 0.3 + colorShift * 6.28) * 0.5 + 0.5,
                        sin(time * 0.7 + colorShift * 6.28) * 0.5 + 0.5
                    );
                    
                    vec3 finalColor = mix(baseColor, timeColor, 0.5 + 0.5 * sin(time * 0.2));
                    
                    // Apply fog
                    float fogFactor = smoothstep(10.0, 100.0, vDistance);
                    finalColor = mix(vec3(0.0), finalColor, fogFactor);
                    
                    gl_FragColor = vec4(finalColor, glow);
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });
        
        const particles = new THREE.Points(geometry, material);
        scene.add(particles);
        
        // Add some ambient floating lights
        const lightGeometry = new THREE.SphereGeometry(1, 16, 16);
        const lightMaterial = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const lights = [];
        for (let i = 0; i < 20; i++) {
            const light = new THREE.Mesh(lightGeometry, lightMaterial.clone());
            light.position.set(
                (Math.random() - 0.5) * 60,
                (Math.random() - 0.5) * 60,
                (Math.random() - 0.5) * 60
            );
            light.scale.setScalar(Math.random() * 2 + 0.5);
            scene.add(light);
            lights.push({
                mesh: light,
                speed: Math.random() * 0.5 + 0.1,
                offset: Math.random() * Math.PI * 2
            });
        }
        
        // Mouse and touch controls
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;
        
        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
            material.uniforms.mouse.value.set(mouseX, mouseY);
        });
        
        document.addEventListener('touchmove', (event) => {
            mouseX = (event.touches[0].clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.touches[0].clientY / window.innerHeight) * 2 + 1;
            material.uniforms.mouse.value.set(mouseX, mouseY);
        });
        
        // Orbit controls for camera
        let isRotating = true;
        let rotateSpeed = 0.001;
        
        document.addEventListener('mousedown', () => {
            isRotating = false;
        });
        
        document.addEventListener('mouseup', () => {
            isRotating = true;
        });
        
        // Zoom with scroll
        let cameraZ = 30;
        document.addEventListener('wheel', (event) => {
            cameraZ += event.deltaY * 0.05;
            cameraZ = Math.max(10, Math.min(cameraZ, 60));
        });
        
        // UI Controls
        const particleCountInput = document.getElementById('particleCount');
        const speedInput = document.getElementById('speed');
        const colorShiftInput = document.getElementById('colorShift');
        const toggleRotationBtn = document.getElementById('toggleRotation');
        const resetViewBtn = document.getElementById('resetView');
        const fpsSpan = document.getElementById('fps');
        
        particleCountInput.addEventListener('input', (e) => {
            const newCount = parseInt(e.target.value);
            updateParticleCount(newCount);
        });
        
        speedInput.addEventListener('input', (e) => {
            material.uniforms.speed.value = parseFloat(e.target.value);
        });
        
        colorShiftInput.addEventListener('input', (e) => {
            material.uniforms.colorShift.value = parseFloat(e.target.value);
        });
        
        toggleRotationBtn.addEventListener('click', () => {
            isRotating = !isRotating;
            toggleRotationBtn.textContent = isRotating ? 'Pause Rotation' : 'Resume Rotation';
        });
        
        resetViewBtn.addEventListener('click', () => {
            cameraZ = 30;
            camera.position.set(0, 0, 30);
            targetX = 0;
            targetY = 0;
        });
        
        // Update particle count dynamically
        function updateParticleCount(newCount) {
            if (newCount === particleCount) return;
            
            const newPositions = new Float32Array(newCount * 3);
            const newColors = new Float32Array(newCount * 3);
            const newSizes = new Float32Array(newCount);
            const newRandomness = new Float32Array(newCount);
            
            // Copy existing particles if reducing count
            const minCount = Math.min(particleCount, newCount);
            for (let i = 0; i < minCount; i++) {
                const i3 = i * 3;
                newPositions[i3] = positions[i3];
                newPositions[i3 + 1] = positions[i3 + 1];
                newPositions[i3 + 2] = positions[i3 + 2];
                
                newColors[i3] = colors[i3];
                newColors[i3 + 1] = colors[i3 + 1];
                newColors[i3 + 2] = colors[i3 + 2];
                
                newSizes[i] = sizes[i];
                newRandomness[i] = randomness[i];
            }
            
            // Generate new particles if increasing count
            for (let i = particleCount; i < newCount; i++) {
                const i3 = i * 3;
                newPositions[i3] = (Math.random() - 0.5) * 100;
                newPositions[i3 + 1] = (Math.random() - 0.5) * 100;
                newPositions[i3 + 2] = (Math.random() - 0.5) * 100;
                
                newColors[i3] = Math.random();
                newColors[i3 + 1] = Math.random();
                newColors[i3 + 2] = Math.random();
                
                newSizes[i] = Math.random() * 2;
                newRandomness[i] = Math.random();
            }
            
            positions = newPositions;
            colors = newColors;
            sizes = newSizes;
            randomness = newRandomness;
            
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            geometry.setAttribute('aRandom', new THREE.BufferAttribute(randomness, 1));
            
            geometry.attributes.position.needsUpdate = true;
            geometry.attributes.color.needsUpdate = true;
            geometry.attributes.size.needsUpdate = true;
            geometry.attributes.aRandom.needsUpdate = true;
        }
        
        // Animation loop
        let lastTime = 0;
        let frameCount = 0;
        let fps = 60;
        
        function animate(time) {
            requestAnimationFrame(animate);
            
            const currentTime = time * 0.001;
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;
            
            // Calculate FPS
            frameCount++;
            if (frameCount % 30 === 0) {
                fps = Math.round(1 / deltaTime);
                fpsSpan.textContent = fps;
            }
            
            // Update uniforms
            material.uniforms.time.value = currentTime;
            material.uniforms.cameraPos.value.copy(camera.position);
            
            // Smooth mouse following
            targetX = mouseX * 10;
            targetY = mouseY * 10;
            camera.position.x += (targetX - camera.position.x) * 0.05;
            camera.position.y += (targetY - camera.position.y) * 0.05;
            camera.lookAt(scene.position);
            
            // Camera zoom
            camera.position.z = THREE.MathUtils.lerp(camera.position.z, cameraZ, 0.1);
            
            // Rotate particles if enabled
            if (isRotating) {
                particles.rotation.y += 0.002;
                particles.rotation.z += 0.001;
            }
            
            // Animate ambient lights
            lights.forEach(light => {
                const mesh = light.mesh;
                mesh.position.x += Math.sin(currentTime * light.speed + light.offset) * 0.1;
                mesh.position.y += Math.cos(currentTime * light.speed + light.offset) * 0.1;
                mesh.position.z += Math.sin(currentTime * light.speed * 0.5 + light.offset) * 0.1;
                mesh.rotation.x += 0.01;
                mesh.rotation.y += 0.01;
            });
            
            renderer.render(scene, camera);
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Start animation
        animate(0);
    </script>
</body>
</html>
