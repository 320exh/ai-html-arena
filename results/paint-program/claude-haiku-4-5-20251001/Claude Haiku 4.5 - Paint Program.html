<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paint Program</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100%;
            gap: 10px;
            padding: 10px;
            overflow: hidden;
        }

        .toolbar {
            background: white;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 200px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
        }

        .tool-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .tool-label {
            font-weight: 600;
            color: #333;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tool-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        button {
            padding: 8px 12px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        button:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        button.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .color-picker-container {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        #colorPicker {
            width: 50px;
            height: 40px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .color-preview {
            flex: 1;
            height: 40px;
            border-radius: 6px;
            border: 2px solid #ddd;
            background: black;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;
            font-weight: 600;
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .slider-label span {
            font-size: 12px;
            color: #666;
        }

        .slider-value {
            font-weight: 600;
            color: #667eea;
            min-width: 30px;
            text-align: right;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            transition: all 0.2s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            background: #764ba2;
            transform: scale(1.2);
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        input[type="range"]::-moz-range-thumb:hover {
            background: #764ba2;
            transform: scale(1.2);
        }

        .canvas-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .canvas-header {
            background: #f8f9fa;
            padding: 10px 15px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .canvas-title {
            font-weight: 600;
            color: #333;
        }

        .canvas-actions {
            display: flex;
            gap: 8px;
        }

        .canvas-actions button {
            padding: 6px 12px;
            font-size: 11px;
        }

        #canvas {
            flex: 1;
            cursor: crosshair;
            display: block;
            background: white;
        }

        .tool-description {
            font-size: 11px;
            color: #999;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 3px solid #667eea;
        }

        .divider {
            height: 1px;
            background: #e0e0e0;
        }

        .shortcut {
            font-size: 10px;
            color: #999;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="toolbar">
            <div>
                <h2 style="color: #333; margin-bottom: 10px; font-size: 16px;">🎨 Paint</h2>
            </div>

            <div class="divider"></div>

            <div class="tool-group">
                <label class="tool-label">Drawing Tools</label>
                <div class="tool-buttons">
                    <button id="penTool" class="active" title="Pen (P)">✏️ Pen</button>
                    <button id="brushTool" title="Brush (B)">🖌️ Brush</button>
                    <button id="eraserTool" title="Eraser (E)">🧹 Eraser</button>
                    <button id="lineTool" title="Line (L)">📏 Line</button>
                    <button id="rectTool" title="Rectangle (R)">▭ Rect</button>
                    <button id="circleTool" title="Circle (C)">● Circle</button>
                </div>
                <div class="tool-description">
                    Select a tool above to draw on the canvas.
                </div>
            </div>

            <div class="divider"></div>

            <div class="tool-group">
                <label class="tool-label">Color</label>
                <div class="color-picker-container">
                    <input type="color" id="colorPicker" value="#000000">
                    <div class="color-preview" id="colorPreview">#000000</div>
                </div>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;">
                    <button style="padding: 6px; background: #000000; border: 2px solid #000;" data-color="#000000"></button>
                    <button style="padding: 6px; background: #FF0000; border: 2px solid #FF0000;" data-color="#FF0000"></button>
                    <button style="padding: 6px; background: #00FF00; border: 2px solid #00FF00;" data-color="#00FF00"></button>
                    <button style="padding: 6px; background: #0000FF; border: 2px solid #0000FF;" data-color="#0000FF"></button>
                    <button style="padding: 6px; background: #FFFF00; border: 2px solid #FFFF00;" data-color="#FFFF00"></button>
                    <button style="padding: 6px; background: #FF00FF; border: 2px solid #FF00FF;" data-color="#FF00FF"></button>
                    <button style="padding: 6px; background: #00FFFF; border: 2px solid #00FFFF;" data-color="#00FFFF"></button>
                    <button style="padding: 6px; background: #FFFFFF; border: 2px solid #999;" data-color="#FFFFFF"></button>
                    <button style="padding: 6px; background: #808080; border: 2px solid #808080;" data-color="#808080"></button>
                </div>
            </div>

            <div class="divider"></div>

            <div class="tool-group">
                <div class="slider-label">
                    <span class="tool-label">Brush Size</span>
                    <span class="slider-value" id="sizeValue">5</span>
                </div>
                <input type="range" id="brushSize" min="1" max="50" value="5">
                <span class="shortcut">Range: 1-50px</span>
            </div>

            <div class="tool-group">
                <div class="slider-label">
                    <span class="tool-label">Opacity</span>
                    <span class="slider-value" id="opacityValue">100%</span>
                </div>
                <input type="range" id="opacity" min="0" max="100" value="100">
                <span class="shortcut">Range: 0-100%</span>
            </div>

            <div class="divider"></div>

            <div class="tool-group">
                <label class="tool-label">Canvas</label>
                <button id="clearBtn" style="width: 100%; padding: 10px;">🗑️ Clear Canvas</button>
                <button id="downloadBtn" style="width: 100%; padding: 10px;">⬇️ Download</button>
                <button id="undoBtn" style="width: 100%; padding: 10px;">↶ Undo</button>
                <button id="redoBtn" style="width: 100%; padding: 10px;">↷ Redo</button>
            </div>
        </div>

        <div class="canvas-container">
            <div class="canvas-header">
                <span class="canvas-title">Canvas</span>
                <div class="canvas-actions">
                    <span style="font-size: 11px; color: #999;">Position: <span id="coordX">0</span>, <span id="coordY">0</span></span>
                </div>
            </div>
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const colorPicker = document.getElementById('colorPicker');
        const brushSize = document.getElementById('brushSize');
        const opacity = document.getElementById('opacity');
        const clearBtn = document.getElementById('clearBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const undoBtn = document.getElementById('undoBtn');
        const redoBtn = document.getElementById('redoBtn');

        // Tool buttons
        const penTool = document.getElementById('penTool');
        const brushTool = document.getElementById('brushTool');
        const eraserTool = document.getElementById('eraserTool');
        const lineTool = document.getElementById('lineTool');
        const rectTool = document.getElementById('rectTool');
        const circleTool = document.getElementById('circleTool');

        // State
        let currentTool = 'pen';
        let isDrawing = false;
        let startX = 0;
        let startY = 0;
        let history = [];
        let historyStep = -1;

        // Initialize canvas
        function initCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            saveHistory();
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();

        // Tool selection
        function selectTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-buttons button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        penTool.addEventListener('click', () => selectTool('pen'));
        brushTool.addEventListener('click', () => selectTool('brush'));
        eraserTool.addEventListener('click', () => selectTool('eraser'));
        lineTool.addEventListener('click', () => selectTool('line'));
        rectTool.addEventListener('click', () => selectTool('rect'));
        circleTool.addEventListener('click', () => selectTool('circle'));

        // Color picker
        colorPicker.addEventListener('change', updateColor);
        colorPicker.addEventListener('input', updateColor);

        function updateColor() {
            const color = colorPicker.value.toUpperCase();
            document.getElementById('colorPreview').textContent = color;
            document.getElementById('colorPreview').style.background = color;
        }

        // Quick color buttons
        document.querySelectorAll('[data-color]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const color = e.target.getAttribute('data-color');
                colorPicker.value = color;
                updateColor();
            });
        });

        // Brush size
        brushSize.addEventListener('input', (e) => {
            document.getElementById('sizeValue').textContent = e.target.value;
        });

        // Opacity
        opacity.addEventListener('input', (e) => {
            document.getElementById('opacityValue').textContent = e.target.value + '%';
        });

        // Drawing functions
        function getDrawColor() {
            if (currentTool === 'eraser') {
                return 'rgba(255, 255, 255, 1)';
            }
            const opacityVal = opacity.value / 100;
            const color = colorPicker.value;
            const r = parseInt(color.slice(1, 3), 16);
            const g = parseInt(color.slice(3, 5), 16);
            const b = parseInt(color.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${opacityVal})`;
        }

        function drawLine(fromX, fromY, toX, toY) {
            ctx.strokeStyle = getDrawColor();
            ctx.lineWidth = brushSize.value;
            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.stroke();
        }

        function drawCircle(centerX, centerY, radius) {
            ctx.strokeStyle = getDrawColor();
            ctx.lineWidth = brushSize.value;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.stroke();
        }

        function drawRect(fromX, fromY, toX, toY) {
            ctx.strokeStyle = getDrawColor();
            ctx.lineWidth = brushSize.value;
            const width = toX - fromX;
            const height = toY - fromY;
            ctx.strokeRect(fromX, fromY, width, height);
        }

        function saveHistory() {
            historyStep++;
            if (historyStep < history.length) {
                history.length = historyStep;
            }
            history.push(canvas.toDataURL());
        }

        function undo() {
            if (historyStep > 0) {
                historyStep--;
                loadHistory();
            }
        }

        function redo() {
            if (historyStep < history.length - 1) {
                historyStep++;
                loadHistory();
            }
        }

        function loadHistory() {
            const img = new Image();
            img.src = history[historyStep];
            img.onload = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
            };
        }

        // Canvas events
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;
            isDrawing = true;

            if (currentTool === 'pen' || currentTool === 'brush' || currentTool === 'eraser') {
                ctx.strokeStyle = getDrawColor();
                ctx.lineWidth = brushSize.value;
                ctx.beginPath();
                ctx.moveTo(startX, startY);
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            document.getElementById('coordX').textContent = Math.round(x);
            document.getElementById('coordY').textContent = Math.round(y);

            if (!isDrawing) return;

            if (currentTool === 'pen' || currentTool === 'brush' || currentTool === 'eraser') {
                ctx.lineTo(x, y);
                ctx.stroke();
            }
        });

        canvas.addEventListener('mouseup', (e) => {
            if (!isDrawing) return;
            
            const rect = canvas.getBoundingClientRect();
            const endX = e.clientX - rect.left;
            const endY = e.clientY - rect.top;

            if (currentTool === 'line') {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const imgData = history[historyStep];
                const img = new Image();
                img.src = imgData;
                img.onload = () => {
                    ctx.drawImage(img, 0, 0);
                    drawLine(startX, startY, endX, endY);
                };
            } else if (currentTool === 'rect') {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const imgData = history[historyStep];
                const img = new Image();
                img.src = imgData;
                img.onload = () => {
                    ctx.drawImage(img, 0, 0);
                    drawRect(startX, startY, endX, endY);
                };
            } else if (currentTool === 'circle') {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const imgData = history[historyStep];
                const img = new Image();
                img.src = imgData;
                img.onload = () => {
                    ctx.drawImage(img, 0, 0);
                    const radius = Math.sqrt(Math.pow(endX - startX, 2) + Math.pow(endY - startY, 2));
                    drawCircle(startX, startY, radius);
                };
            }

            isDrawing = false;
            saveHistory();
        });

        canvas.addEventListener('mouseleave', () => {
            if (isDrawing) {
                isDrawing = false;
                saveHistory();
            }
        });

        // Clear canvas
        clearBtn.addEventListener('click', () => {
            if (confirm('Clear the entire canvas?')) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                saveHistory();
            }
        });

        // Download canvas
        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = 'painting.png';
            link.click();
        });

        // Undo/Redo
        undoBtn.addEventListener('click', undo);
        redoBtn.addEventListener('click', redo);

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'p' || e.key === 'P') penTool.click();
            if (e.key === 'b' || e.key === 'B') brushTool.click();
            if (e.key === 'e' || e.key === 'E') eraserTool.click();
            if (e.key === 'l' || e.key === 'L') lineTool.click();
            if (e.key === 'r' || e.key === 'R') rectTool.click();
            if (e.key === 'c' || e.key === 'C') circleTool.click();
            if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                e.preventDefault();
                undo();
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
                e.preventDefault();
                redo();
            }
        });
    </script>
</body>
</html>
