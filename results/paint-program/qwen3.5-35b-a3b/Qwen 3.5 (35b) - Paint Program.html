<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paint Pro - Full Featured Paint Program</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .tool-btn.active {
            background-color: #3b82f6;
            color: white;
        }
        .color-btn.selected {
            ring: 3px solid #3b82f6;
            transform: scale(1.1);
        }
        canvas {
            cursor: crosshair;
            border: 1px solid #e5e7eb;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-4">🎨 Paint Pro</h1>
        
        <div class="flex gap-4">
            <!-- Toolbar -->
            <div class="bg-white rounded-lg shadow-md p-4 w-64">
                <h2 class="text-lg font-semibold mb-3 text-gray-700">Tools</h2>
                <div class="grid grid-cols-4 gap-2 mb-4">
                    <button class="tool-btn active p-2 rounded hover:bg-gray-100" data-tool="brush" title="Brush">
                        <span class="text-xl">🖌️</span>
                    </button>
                    <button class="tool-btn p-2 rounded hover:bg-gray-100" data-tool="eraser" title="Eraser">
                        <span class="text-xl">🧼</span>
                    </button>
                    <button class="tool-btn p-2 rounded hover:bg-gray-100" data-tool="line" title="Line">
                        <span class="text-xl">📏</span>
                    </button>
                    <button class="tool-btn p-2 rounded hover:bg-gray-100" data-tool="rectangle" title="Rectangle">
                        <span class="text-xl">⬜</span>
                    </button>
                    <button class="tool-btn p-2 rounded hover:bg-gray-100" data-tool="circle" title="Circle">
                        <span class="text-xl">⭕</span>
                    </button>
                    <button class="tool-btn p-2 rounded hover:bg-gray-100" data-tool="triangle" title="Triangle">
                        <span class="text-xl">🔺</span>
                    </button>
                    <button class="tool-btn p-2 rounded hover:bg-gray-100" data-tool="fill" title="Fill">
                        <span class="text-xl">🪣</span>
                    </button>
                    <button class="tool-btn p-2 rounded hover:bg-gray-100" data-tool="picker" title="Color Picker">
                        <span class="text-xl">💉</span>
                    </button>
                </div>

                <h2 class="text-lg font-semibold mb-3 text-gray-700">Brush Size</h2>
                <input type="range" id="brushSize" min="1" max="50" value="5" class="w-full mb-4">
                <div class="flex justify-between text-sm text-gray-600">
                    <span>1px</span>
                    <span id="brushSizeValue">5px</span>
                    <span>50px</span>
                </div>

                <h2 class="text-lg font-semibold mb-3 text-gray-700">Brush Style</h2>
                <select id="brushStyle" class="w-full p-2 border rounded mb-4">
                    <option value="solid">Solid</option>
                    <option value="dashed">Dashed</option>
                    <option value="dotted">Dotted</option>
                </select>

                <h2 class="text-lg font-semibold mb-3 text-gray-700">Colors</h2>
                <div class="grid grid-cols-6 gap-1 mb-4" id="colorPalette">
                    <!-- Colors will be generated by JS -->
                </div>
                <div class="flex items-center gap-2 mb-4">
                    <input type="color" id="customColor" value="#000000" class="w-10 h-10 rounded cursor-pointer">
                    <span class="text-sm text-gray-600">Custom</span>
                </div>

                <h2 class="text-lg font-semibold mb-3 text-gray-700">Actions</h2>
                <div class="space-y-2">
                    <button id="undoBtn" class="w-full p-2 bg-gray-200 rounded hover:bg-gray-300">↩️ Undo</button>
                    <button id="redoBtn" class="w-full p-2 bg-gray-200 rounded hover:bg-gray-300">↪️ Redo</button>
                    <button id="clearBtn" class="w-full p-2 bg-red-500 text-white rounded hover:bg-red-600">🗑️ Clear Canvas</button>
                    <button id="saveBtn" class="w-full p-2 bg-green-500 text-white rounded hover:bg-green-600">💾 Save Image</button>
                </div>
            </div>

            <!-- Canvas Area -->
            <div class="flex-1">
                <div class="bg-white rounded-lg shadow-md p-4">
                    <canvas id="canvas" width="800" height="600" class="w-full rounded"></canvas>
                </div>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="mt-4 bg-white rounded-lg shadow-md p-3 flex justify-between items-center">
            <div class="flex gap-4 text-sm text-gray-600">
                <span id="cursorPos">Position: 0, 0</span>
                <span id="toolInfo">Tool: Brush</span>
            </div>
            <div class="flex gap-2">
                <label class="flex items-center gap-2 text-sm text-gray-600">
                    <input type="checkbox" id="gridToggle" class="rounded">
                    Show Grid
                </label>
            </div>
        </div>
    </div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const brushSizeSlider = document.getElementById('brushSize');
        const brushSizeValue = document.getElementById('brushSizeValue');
        const brushStyleSelect = document.getElementById('brushStyle');
        const colorPalette = document.getElementById('colorPalette');
        const customColor = document.getElementById('customColor');
        const cursorPos = document.getElementById('cursorPos');
        const toolInfo = document.getElementById('toolInfo');
        const gridToggle = document.getElementById('gridToggle');

        // State
        let currentTool = 'brush';
        let currentColor = '#000000';
        let isDrawing = false;
        let startX, startY;
        let brushSize = 5;
        let brushStyle = 'solid';
        let history = [];
        let historyStep = -1;
        let showGrid = false;

        // Preset colors
        const colors = [
            '#000000', '#FFFFFF', '#FF0000', '#00FF00', '#0000FF', '#FFFF00',
            '#FF00FF', '#00FFFF', '#FFA500', '#800080', '#008000', '#808080',
            '#C0C0C0', '#FFC0CB', '#A52A2A', '#800000', '#008080', '#000080',
            '#FF6347', '#90EE90', '#87CEEB', '#FFB6C1', '#F0E68C', '#DDA0DD',
            '#FA8072', '#20B2AA', '#4682B4', '#BDB76B', '#CD5C5C', '#6495ED'
        ];

        // Initialize
        function init() {
            createColorPalette();
            saveState();
            drawGrid();
            setupEventListeners();
        }

        function createColorPalette() {
            colors.forEach(color => {
                const btn = document.createElement('div');
                btn.className = 'color-btn w-8 h-8 rounded cursor-pointer border-2 border-gray-200';
                btn.style.backgroundColor = color;
                btn.dataset.color = color;
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    currentColor = color;
                });
                colorPalette.appendChild(btn);
            });
            // Select first color
            colorPalette.firstChild.click();
        }

        function setupEventListeners() {
            // Tool buttons
            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentTool = btn.dataset.tool;
                    toolInfo.textContent = `Tool: ${currentTool.charAt(0).toUpperCase() + currentTool.slice(1)}`;
                });
            });

            // Brush size
            brushSizeSlider.addEventListener('input', (e) => {
                brushSize = parseInt(e.target.value);
                brushSizeValue.textContent = `${brushSize}px`;
            });

            // Brush style
            brushStyleSelect.addEventListener('change', (e) => {
                brushStyle = e.target.value;
            });

            // Custom color
            customColor.addEventListener('input', (e) => {
                currentColor = e.target.value;
            });

            // Canvas events
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);
            canvas.addEventListener('click', handleCanvasClick);

            // Button events
            document.getElementById('undoBtn').addEventListener('click', undo);
            document.getElementById('redoBtn').addEventListener('click', redo);
            document.getElementById('clearBtn').addEventListener('click', clearCanvas);
            document.getElementById('saveBtn').addEventListener('click', saveImage);
            gridToggle.addEventListener('change', (e) => {
                showGrid = e.target.checked;
                drawGrid();
            });
        }

        function startDrawing(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;
            
            if (currentTool === 'brush' || currentTool === 'eraser') {
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.strokeStyle = currentColor;
                ctx.lineWidth = brushSize;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.setLineDash(brushStyle === 'solid' ? [] : 
                    brushStyle === 'dashed' ? [10, 5] : [3, 3]);
                ctx.lineTo(startX, startY);
                ctx.stroke();
            }
        }

        function draw(e) {
            if (!isDrawing) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (currentTool === 'brush' || currentTool === 'eraser') {
                ctx.strokeStyle = currentTool === 'eraser' ? '#ffffff' : currentColor;
                ctx.lineTo(x, y);
                ctx.stroke();
            }

            cursorPos.textContent = `Position: ${Math.round(x)}, ${Math.round(y)}`;
        }

        function stopDrawing() {
            if (isDrawing) {
                isDrawing = false;
                ctx.closePath();
                saveState();
            }
        }

        function handleCanvasClick(e) {
            if (!isDrawing && (currentTool === 'fill' || currentTool === 'picker')) {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                if (currentTool === 'picker') {
                    const pixel = ctx.getImageData(x, y, 1, 1).data;
                    const color = `rgb(${pixel[0]},${pixel[1]},${pixel[2]})`;
                    customColor.value = rgbToHex(pixel[0], pixel[1], pixel[2]);
                    currentColor = customColor.value;
                } else if (currentTool === 'fill') {
                    floodFill(Math.round(x), Math.round(y), currentColor);
                }
            }
        }

        function floodFill(startX, startY, fillColor) {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixelData = imageData.data;
            const startPos = (startY * canvas.width + startX) * 4;
            
            const startR = pixelData[startPos];
            const startG = pixelData[startPos + 1];
            const startB = pixelData[startPos + 2];
            const startA = pixelData[startPos + 3];

            const fillRGB = hexToRgb(fillColor);
            if (!fillRGB) return;

            if (startR === fillRGB.r && startG === fillRGB.g && startB === fillRGB.b) return;

            const stack = [[startX, startY]];
            const visited = new Set();

            while (stack.length > 0) {
                const [x, y] = stack.pop();
                const pos = (y * canvas.width + x) * 4;
                const key = `${x},${y}`;

                if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) continue;
                if (visited.has(key)) continue;
                if (matchColor(pixelData, pos, startR, startG, startB)) {
                    pixelData[pos] = fillRGB.r;
                    pixelData[pos + 1] = fillRGB.g;
                    pixelData[pos + 2] = fillRGB.b;
                    pixelData[pos + 3] = 255;
                    visited.add(key);
                    stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
                }
            }

            ctx.putImageData(imageData, 0, 0);
            saveState();
        }

        function matchColor(pixelData, pos, startR, startG, startB) {
            const r = pixelData[pos];
            const g = pixelData[pos + 1];
            const b = pixelData[pos + 2];
            return Math.abs(r - startR) < 30 && Math.abs(g - startG) < 30 && Math.abs(b - startB) < 30;
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        function rgbToHex(r, g, b) {
            return '#' + [r, g, b].map(x => {
                const hex = x.toString(16);
                return hex.length === 1 ? '0' + hex : hex;
            }).join('');
        }

        function drawGrid() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.putImageData(imageData, 0, 0);

            if (showGrid) {
                ctx.strokeStyle = '#e5e7eb';
                ctx.lineWidth = 1;
                const gridSize = 20;

                for (let x = 0; x <= canvas.width; x += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }

                for (let y = 0; y <= canvas.height; y += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
            }
        }

        function drawShape(shape) {
            ctx.beginPath();
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = brushSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.setLineDash(brushStyle === 'solid' ? [] : 
                brushStyle === 'dashed' ? [10, 5] : [3, 3]);

            if (shape === 'line') {
                ctx.moveTo(startX, startY);
                ctx.lineTo(startX, startY);
            } else if (shape === 'rectangle') {
                const width = startX - canvas.getBoundingClientRect().left;
                const height = startY - canvas.getBoundingClientRect().top;
                ctx.strokeRect(width, height, startX - width, startY - height);
            } else if (shape === 'circle') {
                const radius = Math.sqrt(Math.pow(startX - canvas.getBoundingClientRect().left, 2) + 
                    Math.pow(startY - canvas.getBoundingClientRect().top, 2));
                ctx.arc(startX, startY, radius, 0, 2 * Math.PI);
            } else if (shape === 'triangle') {
                ctx.moveTo(startX, startY);
                ctx.lineTo(startX + 50, startY + 50);
                ctx.lineTo(startX - 50, startY + 50);
                ctx.closePath();
            }

            ctx.stroke();
            saveState();
        }

        function saveState() {
            historyStep++;
            if (historyStep < history.length) {
                history.length = historyStep;
            }
            history.push(canvas.toDataURL());
            if (history.length > 50) {
                history.shift();
                historyStep--;
            }
        }

        function undo() {
            if (historyStep > 0) {
                historyStep--;
                loadState(history[historyStep]);
            }
        }

        function redo() {
            if (historyStep < history.length - 1) {
                historyStep++;
                loadState(history[historyStep]);
            }
        }

        function loadState(dataUrl) {
            const img = new Image();
            img.onload = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
            };
            img.src = dataUrl;
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            saveState();
        }

        function saveImage() {
            const link = document.createElement('a');
            link.download = 'paint-pro-image.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        // Initialize the app
        init();
    </script>
</body>
</html>
