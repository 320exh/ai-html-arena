<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProPaint - Advanced Web Paint</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            user-select: none;
            overflow: hidden;
        }
        .canvas-container {
            cursor: crosshair;
            background-image: 
                linear-gradient(45deg, #ccc 25%, transparent 25%), 
                linear-gradient(-45deg, #ccc 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #ccc 75%), 
                linear-gradient(-45deg, transparent 75%, #ccc 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            background-color: white;
        }
        .tool-btn {
            @apply p-3 rounded-lg transition-all duration-200 flex items-center justify-center text-gray-400 hover:bg-gray-700 hover:text-white;
        }
        .tool-btn.active {
            @apply bg-blue-600 text-white shadow-lg scale-110;
        }
        #mainCanvas {
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        .custom-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #4b5563;
            border-radius: 5px;
            outline: none;
        }
        .custom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #3b82f6;
            cursor: pointer;
            border-radius: 50%;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col">

    <!-- Header/Top Bar -->
    <header class="h-14 bg-gray-800 border-b border-gray-700 flex items-center justify-between px-4 z-10">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fas fa-palette text-blue-500"></i> ProPaint
            </h1>
            <div class="h-6 w-px bg-gray-700 mx-2"></div>
            <div class="flex items-center gap-2">
                <button id="undoBtn" class="tool-btn !p-2" title="Undo (Ctrl+Z)">
                    <i class="fas fa-undo"></i>
                </button>
                <button id="redoBtn" class="tool-btn !p-2" title="Redo (Ctrl+Y)">
                    <i class="fas fa-redo"></i>
                </button>
            </div>
        </div>

        <div class="flex items-center gap-6">
            <div class="flex items-center gap-3">
                <span class="text-xs uppercase font-semibold text-gray-400">Brush Size</span>
                <input type="range" id="brushSize" min="1" max="100" value="5" class="custom-slider w-32">
                <span id="brushSizeVal" class="text-sm w-6">5px</span>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-xs uppercase font-semibold text-gray-400">Opacity</span>
                <input type="range" id="opacity" min="1" max="100" value="100" class="custom-slider w-32">
                <span id="opacityVal" class="text-sm w-8">100%</span>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <label class="tool-btn cursor-pointer !p-2" title="Upload Image">
                <i class="fas fa-file-import"></i>
                <input type="file" id="imageUpload" class="hidden" accept="image/*">
            </label>
            <button id="clearBtn" class="tool-btn !p-2 text-red-400 hover:text-red-300" title="Clear Canvas">
                <i class="fas fa-trash-alt"></i>
            </button>
            <button id="downloadBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
                <i class="fas fa-download"></i> Export
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Left Toolbar -->
        <aside class="w-20 bg-gray-800 border-r border-gray-700 flex flex-col items-center py-4 gap-4">
            <button id="brushTool" class="tool-btn active" title="Brush">
                <i class="fas fa-paint-brush"></i>
            </button>
            <button id="eraserTool" class="tool-btn" title="Eraser">
                <i class="fas fa-eraser"></i>
            </button>
            <button id="fillTool" class="tool-btn" title="Bucket Fill">
                <i class="fas fa-fill-drip"></i>
            </button>
            <div class="h-px w-10 bg-gray-700 my-2"></div>
            <button id="lineTool" class="tool-btn" title="Line">
                <i class="fas fa-slash"></i>
            </button>
            <button id="rectTool" class="tool-btn" title="Rectangle">
                <i class="far fa-square"></i>
            </button>
            <button id="circleTool" class="tool-btn" title="Circle">
                <i class="far fa-circle"></i>
            </button>
            <button id="textTool" class="tool-btn" title="Text">
                <i class="fas fa-font"></i>
            </button>
            <div class="h-px w-10 bg-gray-700 my-2"></div>
            <div class="flex flex-col items-center gap-3">
                <input type="color" id="colorPicker" class="w-10 h-10 rounded-full cursor-pointer bg-transparent border-none outline-none">
                <div id="palette" class="grid grid-cols-2 gap-2">
                    <!-- Palette colors generated by JS -->
                </div>
            </div>
        </aside>

        <!-- Canvas Area -->
        <main class="flex-1 overflow-auto p-8 flex justify-center items-start canvas-container">
            <canvas id="mainCanvas" class="bg-white shadow-2xl rounded-sm"></canvas>
        </main>
    </div>

    <!-- Status Bar -->
    <footer class="h-8 bg-gray-800 border-t border-gray-700 flex items-center justify-between px-4 text-xs text-gray-500">
        <div id="statusText">Tool: Brush | Coordinates: 0, 0</div>
        <div id="canvasSizeText">Canvas: 1200 x 800</div>
    </footer>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const colorPicker = document.getElementById('colorPicker');
        const brushSizeInput = document.getElementById('brushSize');
        const brushSizeVal = document.getElementById('brushSizeVal');
        const opacityInput = document.getElementById('opacity');
        const opacityVal = document.getElementById('opacityVal');
        const statusText = document.getElementById('statusText');
        
        // State
        let drawing = false;
        let currentTool = 'brush';
        let startX, startY;
        let snapshot;
        let history = [];
        let historyStep = -1;

        const COLORS = [
            '#000000', '#ffffff', '#ff0000', '#00ff00', '#0000ff', 
            '#ffff00', '#ff00ff', '#00ffff', '#ffa500', '#800080'
        ];

        // Initialization
        function init() {
            // Set canvas size
            canvas.width = 1200;
            canvas.height = 800;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            // Background white
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            saveState();
            createPalette();
            setupEventListeners();
            updateStatus('Brush', 0, 0);
        }

        function createPalette() {
            const palette = document.getElementById('palette');
            COLORS.forEach(color => {
                const btn = document.createElement('button');
                btn.className = 'w-5 h-5 rounded-full border border-gray-600';
                btn.style.backgroundColor = color;
                btn.onclick = () => colorPicker.value = color;
                palette.appendChild(btn);
            });
        }

        function setupEventListeners() {
            // Tool Selection
            const tools = {
                'brush': document.getElementById('brushTool'),
                'eraser': document.getElementById('eraserTool'),
                'fill': document.getElementById('fillTool'),
                'line': document.getElementById('lineTool'),
                'rect': document.getElementById('rectTool'),
                'circle': document.getElementById('circleTool'),
                'text': document.getElementById('textTool'),
            };

            Object.entries(tools).forEach(([tool, btn]) => {
                btn.onclick = () => {
                    Object.values(tools).forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentTool = tool;
                };
            });

            // Inputs
            brushSizeInput.oninput = (e) => {
                brushSizeVal.innerText = e.target.value + 'px';
            };
            opacityInput.oninput = (e) => {
                opacityVal.innerText = e.target.value + '%';
            };

            // Canvas Events
            canvas.onmousedown = startDraw;
            canvas.onmousemove = drawingEvent;
            window.onmouseup = endDraw;

            // Utility Buttons
            document.getElementById('clearBtn').onclick = clearCanvas;
            document.getElementById('downloadBtn').onclick = downloadImage;
            document.getElementById('undoBtn').onclick = undo;
            document.getElementById('redoBtn').onclick = redo;
            document.getElementById('imageUpload').onchange = handleImageUpload;

            // Hotkeys
            window.onkeydown = (e) => {
                if (e.ctrlKey && e.key === 'z') undo();
                if (e.ctrlKey && e.key === 'y') redo();
            };
        }

        function updateStatus(tool, x, y) {
            statusText.innerText = `Tool: ${tool.charAt(0).toUpperCase() + tool.slice(1)} | Coordinates: ${x}, ${y}`;
        }

        function startDraw(e) {
            drawing = true;
            const rect = canvas.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;

            ctx.beginPath();
            ctx.lineWidth = brushSizeInput.value;
            ctx.strokeStyle = currentTool === 'eraser' ? '#ffffff' : colorPicker.value;
            ctx.globalAlpha = opacityInput.value / 100;

            // Save current state for shapes
            snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);

            if (currentTool === 'fill') {
                floodFill(Math.floor(startX), Math.floor(startY), colorPicker.value);
                saveState();
                drawing = false;
            } else if (currentTool === 'text') {
                const text = prompt('Enter text:');
                if (text) {
                    ctx.font = `${brushSizeInput.value * 2}px Arial`;
                    ctx.fillStyle = colorPicker.value;
                    ctx.fillText(text, startX, startY);
                    saveState();
                }
                drawing = false;
            }
        }

        function drawingEvent(e) {
            const rect = canvas.getBoundingClientRect();
            const currX = e.clientX - rect.left;
            const currY = e.clientY - rect.top;
            updateStatus(currentTool, Math.floor(currX), Math.floor(currY));

            if (!drawing) return;

            if (currentTool === 'brush' || currentTool === 'eraser') {
                ctx.lineTo(currX, currY);
                ctx.stroke();
            } else {
                // Restore snapshot before drawing shapes for preview
                ctx.putImageData(snapshot, 0, 0);
                
                if (currentTool === 'line') {
                    ctx.beginPath();
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(currX, currY);
                    ctx.stroke();
                } else if (currentTool === 'rect') {
                    ctx.strokeRect(startX, startY, currX - startX, currY - startY);
                } else if (currentTool === 'circle') {
                    ctx.beginPath();
                    let radius = Math.sqrt(Math.pow(currX - startX, 2) + Math.pow(currY - startY, 2));
                    ctx.arc(startX, startY, radius, 0, 2 * Math.PI);
                    ctx.stroke();
                }
            }
        }

        function endDraw() {
            if (drawing) {
                saveState();
                drawing = false;
            }
        }

        function clearCanvas() {
            if (confirm('Are you sure you want to clear the entire canvas?')) {
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                saveState();
            }
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = `propaint-${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    // Scale image to fit canvas or vice-versa
                    // Here we just draw it at center, maintaining aspect ratio
                    const ratio = Math.min(canvas.width / img.width, canvas.height / img.height);
                    const nw = img.width * ratio;
                    const nh = img.height * ratio;
                    const nx = (canvas.width - nw) / 2;
                    const ny = (canvas.height - nh) / 2;
                    
                    ctx.drawImage(img, nx, ny, nw, nh);
                    saveState();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        // --- Flood Fill Implementation ---
        function floodFill(startX, startY, fillColor) {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            const targetColor = getPixelColor(data, startX, startY);
            const fillRGB = hexToRgb(fillColor);
            
            if (colorsMatch(targetColor, fillRGB)) return;

            const queue = [[startX, startY]];
            
            while (queue.length > 0) {
                const [x, y] = queue.shift();
                
                if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) continue;
                
                if (colorsMatch(getPixelColor(data, x, y), targetColor)) {
                    setPixelColor(data, x, y, fillRGB);
                    queue.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
                }
            }
            
            ctx.putImageData(imageData, 0, 0);
        }

        function getPixelColor(data, x, y) {
            const index = (y * canvas.width + x) * 4;
            return [data[index], data[index+1], data[index+2], data[index+3]];
        }

        function setPixelColor(data, x, y, color) {
            const index = (y * canvas.width + x) * 4;
            data[index] = color[0];
            data[index+1] = color[1];
            data[index+2] = color[2];
            data[index+3] = 255;
        }

        function colorsMatch(c1, c2) {
            return c1[0] === c2[0] && c1[1] === c2[1] && c1[2] === c2[2];
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? [
                parseInt(result[1], 16),
                parseInt(result[2], 16),
                parseInt(result[3], 16)
            ] : [0, 0, 0];
        }

        // --- History System (Undo/Redo) ---
        function saveState() {
            // Remove any redo history if we make a new change
            if (historyStep < history.length - 1) {
                history = history.slice(0, historyStep + 1);
            }
            
            history.push(canvas.toDataURL());
            if (history.length > 20) history.shift();
            historyStep = history.length - 1;
        }

        function undo() {
            if (historyStep > 0) {
                historyStep--;
                loadHistoryState();
            }
        }

        function redo() {
            if (historyStep < history.length - 1) {
                historyStep++;
                loadHistoryState();
            }
        }

        function loadHistoryState() {
            const img = new Image();
            img.src = history[historyStep];
            img.onload = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
            };
        }

        init();
    </script>
</body>
</html>
