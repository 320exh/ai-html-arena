<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProPaint JS</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            overflow: hidden;
            user-select: none;
        }
        canvas {
            cursor: crosshair;
            image-rendering: pixelated;
        }
        .tool-btn.active {
            background-color: #3b82f6;
            color: white;
        }
        #canvas-container {
            background-image: 
                linear-gradient(45deg, #ccc 25%, transparent 25%), 
                linear-gradient(-45deg, #ccc 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #ccc 75%), 
                linear-gradient(-45deg, transparent 75%, #ccc 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            background-color: white;
        }
    </style>
</head>
<body class="bg-zinc-900 text-zinc-100 h-screen flex flex-col">

    <!-- Top Toolbar -->
    <header class="h-14 border-b border-zinc-800 flex items-center justify-between px-4 bg-zinc-950 shrink-0">
        <div class="flex items-center gap-4">
            <h1 class="text-lg font-bold text-blue-500">ProPaint<span class="text-zinc-400 font-light">JS</span></h1>
            <div class="h-6 w-px bg-zinc-800"></div>
            <div class="flex gap-1">
                <button id="undoBtn" class="p-2 hover:bg-zinc-800 rounded transition" title="Undo (Ctrl+Z)">
                    <i data-lucide="undo-2" class="w-5 h-5"></i>
                </button>
                <button id="redoBtn" class="p-2 hover:bg-zinc-800 rounded transition" title="Redo (Ctrl+Y)">
                    <i data-lucide="redo-2" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 bg-zinc-900 px-3 py-1 rounded-full border border-zinc-800">
                <span class="text-xs text-zinc-500">Brush Size</span>
                <input type="range" id="sizeSlider" min="1" max="100" value="5" class="w-24 accent-blue-500">
                <span id="sizeDisplay" class="text-xs font-mono w-6">5</span>
            </div>
            <button id="clearBtn" class="flex items-center gap-2 px-3 py-1.5 bg-red-900/30 text-red-400 hover:bg-red-900/50 rounded-md transition text-sm">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
                Clear
            </button>
            <button id="saveBtn" class="flex items-center gap-2 px-4 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-md transition text-sm font-medium">
                <i data-lucide="download" class="w-4 h-4"></i>
                Save
            </button>
        </div>
    </header>

    <main class="flex flex-1 overflow-hidden">
        <!-- Sidebar Tools -->
        <aside class="w-16 bg-zinc-950 border-r border-zinc-800 flex flex-col items-center py-4 gap-4 shrink-0">
            <div class="flex flex-col gap-2">
                <button data-tool="pencil" class="tool-btn p-3 rounded-xl hover:bg-zinc-800 transition active" title="Pencil">
                    <i data-lucide="pencil" class="w-6 h-6"></i>
                </button>
                <button data-tool="brush" class="tool-btn p-3 rounded-xl hover:bg-zinc-800 transition" title="Brush">
                    <i data-lucide="brush" class="w-6 h-6"></i>
                </button>
                <button data-tool="eraser" class="tool-btn p-3 rounded-xl hover:bg-zinc-800 transition" title="Eraser">
                    <i data-lucide="eraser" class="w-6 h-6"></i>
                </button>
                <button data-tool="spray" class="tool-btn p-3 rounded-xl hover:bg-zinc-800 transition" title="Spray Can">
                    <i data-lucide="spray-can" class="w-6 h-6"></i>
                </button>
                <button data-tool="bucket" class="tool-btn p-3 rounded-xl hover:bg-zinc-800 transition" title="Fill Bucket">
                    <i data-lucide="paint-bucket" class="w-6 h-6"></i>
                </button>
            </div>

            <div class="h-px w-8 bg-zinc-800"></div>

            <div class="flex flex-col gap-2">
                <button data-tool="line" class="tool-btn p-3 rounded-xl hover:bg-zinc-800 transition" title="Line">
                    <i data-lucide="minus" class="w-6 h-6 rotate-45"></i>
                </button>
                <button data-tool="rect" class="tool-btn p-3 rounded-xl hover:bg-zinc-800 transition" title="Rectangle">
                    <i data-lucide="square" class="w-6 h-6"></i>
                </button>
                <button data-tool="circle" class="tool-btn p-3 rounded-xl hover:bg-zinc-800 transition" title="Circle">
                    <i data-lucide="circle" class="w-6 h-6"></i>
                </button>
            </div>

            <div class="mt-auto flex flex-col items-center gap-4">
                <div class="relative group">
                    <input type="color" id="colorPicker" value="#3b82f6" class="w-10 h-10 rounded-full border-2 border-zinc-700 cursor-pointer bg-transparent appearance-none overflow-hidden">
                    <div class="absolute bottom-full mb-2 left-1/2 -translate-x-1/2 bg-zinc-800 text-[10px] px-2 py-1 rounded opacity-0 group-hover:opacity-100 pointer-events-none transition">Color</div>
                </div>
            </div>
        </aside>

        <!-- Canvas Area -->
        <section class="flex-1 relative overflow-auto bg-zinc-900 p-8 flex justify-center items-start">
            <div id="canvas-container" class="shadow-2xl shadow-black/50 relative">
                <canvas id="mainCanvas"></canvas>
                <canvas id="tempCanvas" class="absolute top-0 left-0 pointer-events-none"></canvas>
            </div>
        </section>

        <!-- Properties Panel (Right) -->
        <aside class="w-64 bg-zinc-950 border-l border-zinc-800 p-4 flex flex-col gap-6 shrink-0">
            <div>
                <h3 class="text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-4">Properties</h3>
                <div class="space-y-4">
                    <div>
                        <label class="text-sm block mb-2">Opacity</label>
                        <input type="range" id="opacitySlider" min="0" max="100" value="100" class="w-full accent-blue-500">
                    </div>
                </div>
            </div>

            <div class="mt-auto">
                <div class="p-4 bg-zinc-900 rounded-lg border border-zinc-800">
                    <p class="text-[10px] text-zinc-500 uppercase mb-1">Current Tool</p>
                    <p id="currentToolName" class="text-sm font-medium capitalize">Pencil</p>
                </div>
            </div>
        </aside>
    </main>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const tempCanvas = document.getElementById('tempCanvas');
        const tempCtx = tempCanvas.getContext('2d');
        const container = document.getElementById('canvas-container');

        // UI Elements
        const colorPicker = document.getElementById('colorPicker');
        const sizeSlider = document.getElementById('sizeSlider');
        const sizeDisplay = document.getElementById('sizeDisplay');
        const opacitySlider = document.getElementById('opacitySlider');
        const toolBtns = document.querySelectorAll('.tool-btn');
        const currentToolNameDisp = document.getElementById('currentToolName');
        const undoBtn = document.getElementById('undoBtn');
        const redoBtn = document.getElementById('redoBtn');
        const clearBtn = document.getElementById('clearBtn');
        const saveBtn = document.getElementById('saveBtn');

        // State
        let drawing = false;
        let currentTool = 'pencil';
        let startX, startY;
        let brushColor = '#3b82f6';
        let brushSize = 5;
        let brushOpacity = 1;
        let undoStack = [];
        let redoStack = [];

        // Constants
        const CANVAS_WIDTH = 1200;
        const CANVAS_HEIGHT = 800;

        function init() {
            // Set canvas size
            canvas.width = CANVAS_WIDTH;
            canvas.height = CANVAS_HEIGHT;
            tempCanvas.width = CANVAS_WIDTH;
            tempCanvas.height = CANVAS_HEIGHT;

            // Initial Fill
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Save initial state
            saveState();

            // Event Listeners
            canvas.addEventListener('mousedown', startDrawing);
            window.addEventListener('mousemove', draw);
            window.addEventListener('mouseup', stopDrawing);
            
            colorPicker.addEventListener('input', (e) => brushColor = e.target.value);
            sizeSlider.addEventListener('input', (e) => {
                brushSize = parseInt(e.target.value);
                sizeDisplay.textContent = brushSize;
            });
            opacitySlider.addEventListener('input', (e) => brushOpacity = e.target.value / 100);

            toolBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    toolBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentTool = btn.dataset.tool;
                    currentToolNameDisp.textContent = currentTool;
                });
            });

            undoBtn.addEventListener('click', undo);
            redoBtn.addEventListener('click', redo);
            clearBtn.addEventListener('click', clearCanvas);
            saveBtn.addEventListener('click', saveImage);

            // Shortcuts
            window.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 'z') undo();
                if (e.ctrlKey && e.key === 'y') redo();
            });
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        function startDrawing(e) {
            drawing = true;
            const pos = getMousePos(e);
            startX = pos.x;
            startY = pos.y;

            if (currentTool === 'bucket') {
                floodFill(Math.floor(pos.x), Math.floor(pos.y), hexToRgb(brushColor));
                saveState();
                return;
            }

            if (currentTool === 'pencil' || currentTool === 'brush' || currentTool === 'eraser' || currentTool === 'spray') {
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                
                // For eraser, we need to use destination-out or just white
                if (currentTool === 'eraser') {
                    ctx.globalCompositeOperation = 'destination-out';
                } else {
                    ctx.globalCompositeOperation = 'source-over';
                }
                ctx.strokeStyle = currentTool === 'eraser' ? 'rgba(0,0,0,1)' : brushColor;
                ctx.lineWidth = brushSize;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.globalAlpha = brushOpacity;
            }
        }

        function draw(e) {
            if (!drawing) return;
            const pos = getMousePos(e);

            if (currentTool === 'pencil' || currentTool === 'brush' || currentTool === 'eraser' || currentTool === 'spray') {
                if (currentTool === 'spray') {
                    spray(pos.x, pos.y);
                } else {
                    ctx.lineTo(pos.x, pos.y);
                    ctx.stroke();
                }
            } else {
                // Shapes: draw on temp canvas
                tempCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
                tempCtx.strokeStyle = brushColor;
                tempCtx.lineWidth = brushSize;
                tempCtx.globalAlpha = brushOpacity;
                tempCtx.lineCap = 'round';
                tempCtx.lineJoin = 'round';

                if (currentTool === 'line') {
                    tempCtx.beginPath();
                    tempCtx.moveTo(startX, startY);
                    tempCtx.lineTo(pos.x, pos.y);
                    tempCtx.stroke();
                } else if (currentTool === 'rect') {
                    tempCtx.strokeRect(startX, startY, pos.x - startX, pos.y - startY);
                } else if (currentTool === 'circle') {
                    const radius = Math.sqrt(Math.pow(pos.x - startX, 2) + Math.pow(pos.y - startY, 2));
                    tempCtx.beginPath();
                    tempCtx.arc(startX, startY, radius, 0, Math.PI * 2);
                    tempCtx.stroke();
                }
            }
        }

        function stopDrawing(e) {
            if (!drawing) return;
            
            if (currentTool === 'pencil' || currentTool === 'brush' || currentTool === 'eraser' || currentTool === 'spray') {
                // End of line drawing
                // For eraser, we need to reset globalCompositeOperation for future calls
                ctx.globalCompositeOperation = 'source-over';
            } else if (['line', 'rect', 'circle'].includes(currentTool)) {
                // Commit temp canvas to main canvas
                ctx.globalAlpha = brushOpacity;
                ctx.globalCompositeOperation = 'source-over';
                ctx.drawImage(tempCanvas, 0, 0);
                tempCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
            }

            drawing = false;
            saveState();
        }

        function spray(x, y) {
            const density = 30;
            const radius = brushSize;
            ctx.fillStyle = brushColor;
            ctx.globalAlpha = brushOpacity;

            for (let i = 0; i < density; i++) {
                const offset = getRandomOffset(radius);
                ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
            }
        }

        function getRandomOffset(radius) {
            const angle = Math.random() * Math.PI * 2;
            const r = Math.random() * radius;
            return {
                x: Math.cos(angle) * r,
                y: Math.sin(angle) * r
            };
        }

        // Flood Fill Algorithm
        function floodFill(x, y, fillColor) {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            const targetColor = getPixelColor(data, x, y);
            
            if (colorsMatch(targetColor, fillColor)) return;

            const stack = [[x, y]];

            while (stack.length > 0) {
                const [cx, cy] = stack.pop();

                if (cx < 0 || cx >= canvas.width || cy < 0 || cy >= canvas.height) continue;

                const currentColor = getPixelColor(data, cx, cy);
                if (colorsMatch(currentColor, targetColor)) {
                    setPixelColor(data, cx, cy, fillColor);

                    stack.push([cx + 1, cy]);
                    stack.push([cx - 1, cy]);
                    stack.push([cx, cy + 1]);
                    stack.push([cx, cy - 1]);
                }
            }

            ctx.putImageData(imageData, 0, 0);
        }

        function getPixelColor(data, x, y) {
            const idx = (y * canvas.width + x) * 4;
            return [data[idx], data[idx+1], data[idx+2], data[idx+3]];
        }

        function setPixelColor(data, x, y, color) {
            const idx = (y * canvas.width + x) * 4;
            data[idx] = color[0];
            data[idx+1] = color[1];
            data[idx+2] = color[2];
            data[idx+3] = 255;
        }

        function colorsMatch(c1, c2) {
            return c1[0] === c2[0] && c1[1] === c2[1] && c1[2] === c2[2];
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\\d]{2})([a-f\\d]{2})([a-f\\d]{2})$/i.exec(hex);
            return result ? [
                parseInt(result[1], 16),
                parseInt(result[2], 16),
                parseInt(result[3], 16)
            ] : [0, 0, 0];
        }

        // State Management
        function saveState() {
            undoStack.push(canvas.toDataURL());
            if (undoStack.length > 20) undoStack.shift();
            redoStack = []; // Clear redo stack on new action
        }

        function undo() {
            if (undoStack.length <= 1) return;
            
            redoStack.push(undoStack.pop());
            const prevState = undoStack[undoStack.length - 1];
            loadState(prevState);
        }

        function redo() {
            if (redoStack.length === 0) return;

            const nextState = redoStack.pop();
            undoStack.push(nextState);
            loadState(nextState);
        }

        function loadState(dataUrl) {
            const img = new Image();
            img.onload = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
            };
            img.src = dataUrl;
        }

        function clearCanvas() {
            if (confirm('Are you sure you want to clear the entire canvas?')) {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                saveState();
            }
        }

        function saveImage() {
            const link = document.createElement('a');
            link.download = 'my-masterpiece.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        init();

    </script>
</body>
</html>
