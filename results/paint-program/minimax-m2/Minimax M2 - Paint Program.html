<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paint Pro - Drawing Application</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .tool-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .color-swatch.active {
            transform: scale(1.2);
            box-shadow: 0 0 0 3px white, 0 0 0 5px #667eea;
        }
        canvas {
            cursor: crosshair;
        }
        .eraser-cursor {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>') 12 12, auto;
        }
        .brush-cursor {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="black"><circle cx="12" cy="12" r="8"/></svg>') 12 12, auto;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-purple-900 to-gray-900 min-h-screen">
    <div class="flex flex-col h-screen">
        <!-- Header -->
        <header class="bg-gray-800/80 backdrop-blur-sm border-b border-gray-700 px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-pink-500 to-purple-600 rounded-lg flex items-center justify-center">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-white">Paint Pro</h1>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="undo()" class="px-3 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg flex items-center gap-2 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path>
                    </svg>
                    Undo
                </button>
                <button onclick="redo()" class="px-3 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg flex items-center gap-2 transition">
                    Redo
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 10h-10a8 8 0 00-8 8v2M21 10l-6 6m6-6l-6-6"></path>
                    </svg>
                </button>
                <button onclick="clearCanvas()" class="px-3 py-2 bg-red-600 hover:bg-red-500 text-white rounded-lg flex items-center gap-2 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                    </svg>
                    Clear
                </button>
                <button onclick="saveCanvas()" class="px-3 py-2 bg-green-600 hover:bg-green-500 text-white rounded-lg flex items-center gap-2 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                    </svg>
                    Save
                </button>
            </div>
        </header>

        <div class="flex flex-1 overflow-hidden">
            <!-- Left Toolbar -->
            <aside class="bg-gray-800/80 backdrop-blur-sm border-r border-gray-700 p-4 flex flex-col gap-4 w-20 items-center">
                <!-- Tools -->
                <div class="space-y-2">
                    <p class="text-gray-400 text-xs text-center">Tools</p>
                    <button onclick="setTool('brush')" id="tool-brush" class="tool-btn active w-12 h-12 bg-gray-700 hover:bg-gray-600 rounded-lg flex items-center justify-center transition">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path>
                        </svg>
                    </button>
                    <button onclick="setTool('eraser')" id="tool-eraser" class="tool-btn w-12 h-12 bg-gray-700 hover:bg-gray-600 rounded-lg flex items-center justify-center transition">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                        </svg>
                    </button>
                    <button onclick="setTool('fill')" id="tool-fill" class="tool-btn w-12 h-12 bg-gray-700 hover:bg-gray-600 rounded-lg flex items-center justify-center transition">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path>
                        </svg>
                    </button>
                    <button onclick="setTool('line')" id="tool-line" class="tool-btn w-12 h-12 bg-gray-700 hover:bg-gray-600 rounded-lg flex items-center justify-center transition">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 20L20 4"></path>
                        </svg>
                    </button>
                    <button onclick="setTool('rect')" id="tool-rect" class="tool-btn w-12 h-12 bg-gray-700 hover:bg-gray-600 rounded-lg flex items-center justify-center transition">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <rect x="3" y="3" width="18" height="18" rx="2" stroke-width="2"></rect>
                        </svg>
                    </button>
                    <button onclick="setTool('circle')" id="tool-circle" class="tool-btn w-12 h-12 bg-gray-700 hover:bg-gray-600 rounded-lg flex items-center justify-center transition">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="9" stroke-width="2"></circle>
                        </svg>
                    </button>
                    <button onclick="setTool('text')" id="tool-text" class="tool-btn w-12 h-12 bg-gray-700 hover:bg-gray-600 rounded-lg flex items-center justify-center transition">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
                        </svg>
                    </button>
                    <button onclick="setTool('spray')" id="tool-spray" class="tool-btn w-12 h-12 bg-gray-700 hover:bg-gray-600 rounded-lg flex items-center justify-center transition">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                        </svg>
                    </button>
                </div>

                <!-- Brush Size -->
                <div class="space-y-2">
                    <p class="text-gray-400 text-xs text-center">Size</p>
                    <div class="flex flex-col gap-2">
                        <input type="range" id="brushSize" min="1" max="100" value="10" class="w-12 h-24 accent-purple-500" onchange="updateBrushSize()">
                        <span id="brushSizeLabel" class="text-white text-xs text-center">10px</span>
                    </div>
                </div>
            </aside>

            <!-- Main Canvas Area -->
            <main class="flex-1 flex flex-col">
                <div class="flex-1 p-4 flex items-center justify-center overflow-auto">
                    <div class="relative shadow-2xl rounded-lg overflow-hidden">
                        <canvas id="canvas" class="bg-white"></canvas>
                        <div id="textInput" class="absolute hidden">
                            <input type="text" id="textField" class="border-2 border-purple-500 outline-none px-2 py-1" placeholder="Type here...">
                        </div>
                    </div>
                </div>
                
                <!-- Status Bar -->
                <div class="bg-gray-800/80 backdrop-blur-sm border-t border-gray-700 px-4 py-2 flex items-center justify-between text-gray-400 text-sm">
                    <span id="coordinates">X: 0, Y: 0</span>
                    <span id="canvasSize">Canvas: 800 x 600</span>
                    <span id="currentTool">Tool: Brush</span>
                </div>
            </main>

            <!-- Right Panel - Colors & Options -->
            <aside class="bg-gray-800/80 backdrop-blur-sm border-l border-gray-700 p-4 flex flex-col gap-4 w-64">
                <!-- Color Picker -->
                <div class="space-y-2">
                    <p class="text-gray-400 text-xs font-semibold uppercase tracking-wide">Primary Color</p>
                    <div class="flex items-center gap-2">
                        <input type="color" id="primaryColor" value="#000000" class="w-12 h-12 rounded cursor-pointer border-2 border-gray-600" onchange="updateColor()">
                        <input type="text" id="colorHex" value="#000000" class="flex-1 bg-gray-700 text-white px-3 py-2 rounded border border-gray-600" onchange="updateColorFromHex()">
                    </div>
                </div>

                <!-- Secondary Color -->
                <div class="space-y-2">
                    <p class="text-gray-400 text-xs font-semibold uppercase tracking-wide">Secondary Color</p>
                    <div class="flex items-center gap-2">
                        <input type="color" id="secondaryColor" value="#ffffff" class="w-12 h-12 rounded cursor-pointer border-2 border-gray-600" onchange="updateSecondaryColor()">
                        <span class="text-gray-400 text-sm">Right-click to use</span>
                    </div>
                </div>

                <!-- Color Palette -->
                <div class="space-y-2">
                    <p class="text-gray-400 text-xs font-semibold uppercase tracking-wide">Palette</p>
                    <div class="grid grid-cols-6 gap-1">
                        <button onclick="setColor('#000000')" class="color-swatch w-8 h-8 rounded bg-black border border-gray-600"></button>
                        <button onclick="setColor('#FFFFFF')" class="color-swatch w-8 h-8 rounded bg-white border border-gray-600"></button>
                        <button onclick="setColor('#FF0000')" class="color-swatch w-8 h-8 rounded bg-red-500 border border-gray-600"></button>
                        <button onclick="setColor('#00FF00')" class="color-swatch w-8 h-8 rounded bg-green-500 border border-gray-600"></button>
                        <button onclick="setColor('#0000FF')" class="color-swatch w-8 h-8 rounded bg-blue-500 border border-gray-600"></button>
                        <button onclick="setColor('#FFFF00')" class="color-swatch w-8 h-8 rounded bg-yellow-500 border border-gray-600"></button>
                        <button onclick="setColor('#FF00FF')" class="color-swatch w-8 h-8 rounded bg-fuchsia-500 border border-gray-600"></button>
                        <button onclick="setColor('#00FFFF')" class="color-swatch w-8 h-8 rounded bg-cyan-500 border border-gray-600"></button>
                        <button onclick="setColor('#FFA500')" class="color-swatch w-8 h-8 rounded bg-orange-500 border border-gray-600"></button>
                        <button onclick="setColor('#800080')" class="color-swatch w-8 h-8 rounded bg-purple-600 border border-gray-600"></button>
                        <button onclick="setColor('#FFC0CB')" class="color-swatch w-8 h-8 rounded bg-pink-300 border border-gray-600"></button>
                        <button onclick="setColor('#808080')" class="color-swatch w-8 h-8 rounded bg-gray-500 border border-gray-600"></button>
                    </div>
                </div>

                <!-- Canvas Size -->
                <div class="space-y-2">
                    <p class="text-gray-400 text-xs font-semibold uppercase tracking-wide">Canvas Size</p>
                    <div class="flex gap-2">
                        <input type="number" id="canvasWidth" value="800" class="w-20 bg-gray-700 text-white px-2 py-2 rounded border border-gray-600" placeholder="Width">
                        <span class="text-gray-400 self-center">x</span>
                        <input type="number" id="canvasHeight" value="600" class="w-20 bg-gray-700 text-white px-2 py-2 rounded border border-gray-600" placeholder="Height">
                    </div>
                    <button onclick="resizeCanvas()" class="w-full bg-purple-600 hover:bg-purple-500 text-white py-2 rounded transition">Resize Canvas</button>
                </div>

                <!-- Fill Options -->
                <div class="space-y-2">
                    <p class="text-gray-400 text-xs font-semibold uppercase tracking-wide">Fill Options</p>
                    <label class="flex items-center gap-2 text-white">
                        <input type="checkbox" id="fillShape" class="accent-purple-500">
                        <span>Fill Shapes</span>
                    </label>
                </div>

                <!-- Opacity -->
                <div class="space-y-2">
                    <p class="text-gray-400 text-xs font-semibold uppercase tracking-wide">Opacity</p>
                    <input type="range" id="opacity" min="1" max="100" value="100" class="w-full accent-purple-500" onchange="updateOpacity()">
                    <span id="opacityLabel" class="text-white text-xs">100%</span>
                </div>
            </aside>
        </div>
    </div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // State
        let isDrawing = false;
        let currentTool = 'brush';
        let currentColor = '#000000';
        let secondaryColor = '#ffffff';
        let brushSize = 10;
        let opacity = 1;
        let fillShape = false;
        let lastX = 0;
        let lastY = 0;
        
        // History for undo/redo
        let history = [];
        let historyIndex = -1;
        let tempCanvas = null;
        
        // Shape preview
        let startX = 0;
        let startY = 0;

        // Initialize canvas
        function initCanvas() {
            canvas.width = 800;
            canvas.height = 600;
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            saveState();
            updateCursor();
        }

        // Save current state to history
        function saveState() {
            if (historyIndex < history.length - 1) {
                history = history.slice(0, historyIndex + 1);
            }
            history.push(canvas.toDataURL());
            historyIndex = history.length - 1;
            if (history.length > 50) {
                history.shift();
                historyIndex--;
            }
        }

        // Undo
        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                loadState();
            }
        }

        // Redo
        function redo() {
            if (historyIndex < history.length - 1) {
                historyIndex++;
                loadState();
            }
        }

        // Load state from history
        function loadState() {
            const img = new Image();
            img.onload = function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
            };
            img.src = history[historyIndex];
        }

        // Set tool
        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('tool-' + tool).classList.add('active');
            document.getElementById('currentTool').textContent = 'Tool: ' + tool.charAt(0).toUpperCase() + tool.slice(1);
            updateCursor();
        }

        // Update cursor based on tool
        function updateCursor() {
            canvas.classList.remove('brush-cursor', 'eraser-cursor');
            if (currentTool === 'eraser') {
                canvas.classList.add('eraser-cursor');
            } else if (currentTool === 'brush' || currentTool === 'fill') {
                canvas.classList.add('brush-cursor');
            }
        }

        // Set color
        function setColor(color) {
            currentColor = color;
            document.getElementById('primaryColor').value = color;
            document.getElementById('colorHex').value = color;
        }

        // Update color from picker
        function updateColor() {
            currentColor = document.getElementById('primaryColor').value;
            document.getElementById('colorHex').value = currentColor;
        }

        // Update color from hex input
        function updateColorFromHex() {
            const hex = document.getElementById('colorHex').value;
            if (/^#[0-9A-Fa-f]{6}$/.test(hex)) {
                currentColor = hex;
                document.getElementById('primaryColor').value = hex;
            }
        }

        // Update secondary color
        function updateSecondaryColor() {
            secondaryColor = document.getElementById('secondaryColor').value;
        }

        // Update brush size
        function updateBrushSize() {
            brushSize = document.getElementById('brushSize').value;
            document.getElementById('brushSizeLabel').textContent = brushSize + 'px';
        }

        // Update opacity
        function updateOpacity() {
            opacity = document.getElementById('opacity').value / 100;
            document.getElementById('opacityLabel').textContent = document.getElementById('opacity').value + '%';
        }

        // Resize canvas
        function resizeCanvas() {
            const width = parseInt(document.getElementById('canvasWidth').value) || 800;
            const height = parseInt(document.getElementById('canvasHeight').value) || 600;
            
            // Save current image
            const tempImg = canvas.toDataURL();
            
            // Resize
            canvas.width = width;
            canvas.height = height;
            
            // Fill with white
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, width, height);
            
            document.getElementById('canvasSize').textContent = `Canvas: ${width} x ${height}`;
            
            // Restore image if possible
            const img = new Image();
            img.onload = function() {
                ctx.drawImage(img, 0, 0);
                saveState();
            };
            img.src = tempImg;
        }

        // Clear canvas
        function clearCanvas() {
            if (confirm('Are you sure you want to clear the canvas?')) {
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                saveState();
            }
        }

        // Save canvas
        function saveCanvas() {
            const link = document.createElement('a');
            link.download = 'paint-pro-' + Date.now() + '.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        // Flood fill algorithm
        function floodFill(startX, startY, fillColor) {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const startPos = (startY * canvas.width + startX) * 4;
            
            const startR = data[startPos];
            const startG = data[startPos + 1];
            const startB = data[startPos + 2];
            
            const fillR = parseInt(fillColor.slice(1, 3), 16);
            const fillG = parseInt(fillColor.slice(3, 5), 16);
            const fillB = parseInt(fillColor.slice(5, 7), 16);
            
            if (startR === fillR && startG === fillG && startB === fillB) return;
            
            const stack = [[startX, startY]];
            const visited = new Set();
            
            while (stack.length > 0) {
                const [x, y] = stack.pop();
                const key = `${x},${y}`;
                
                if (visited.has(key)) continue;
                if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) continue;
                
                const pos = (y * canvas.width + x) * 4;
                if (data[pos] !== startR || data[pos + 1] !== startG || data[pos + 2] !== startB) continue;
                
                visited.add(key);
                
                data[pos] = fillR;
                data[pos + 1] = fillG;
                data[pos + 2] = fillB;
                data[pos + 3] = 255;
                
                stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
            }
            
            ctx.putImageData(imageData, 0, 0);
        }

        // Spray tool
        function spray(x, y) {
            for (let i = 0; i < 20; i++) {
                const offsetX = (Math.random() - 0.5) * brushSize * 2;
                const offsetY = (Math.random() - 0.5) * brushSize * 2;
                const distance = Math.sqrt(offsetX * offsetX + offsetY * offsetY);
                
                if (distance < brushSize) {
                    ctx.fillStyle = currentColor;
                    ctx.globalAlpha = Math.random() * 0.5;
                    ctx.beginPath();
                    ctx.arc(x + offsetX, y + offsetY, Math.random() * 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.globalAlpha = 1;
        }

        // Draw functions
        function startDrawing(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            startX = (e.clientX - rect.left) * scaleX;
            startY = (e.clientY - rect.top) * scaleY;
            lastX = startX;
            lastY = startY;
            
            // Handle right click for secondary color
            if (e.button === 2) {
                currentColor = secondaryColor;
            }
            
            // Fill tool
            if (currentTool === 'fill') {
                floodFill(Math.floor(startX), Math.floor(startY), currentColor);
                isDrawing = false;
                saveState();
                return;
            }
            
            // Text tool
            if (currentTool === 'text') {
                const textField = document.getElementById('textField');
                const textInput = document.getElementById('textInput');
                textInput.style.left = (e.clientX - rect.left) + 'px';
                textInput.style.top = (e.clientY - rect.top) + 'px';
                textInput.classList.remove('hidden');
                textField.value = '';
                textField.focus();
                
                textField.onkeydown = function(event) {
                    if (event.key === 'Enter') {
                        ctx.font = `${brushSize * 2}px Arial`;
                        ctx.fillStyle = currentColor;
                        ctx.fillText(textField.value, startX, startY);
                        textInput.classList.add('hidden');
                        saveState();
                    }
                };
                isDrawing = false;
                return;
            }
            
            // Save canvas state before drawing shapes
            if (['line', 'rect', 'circle'].includes(currentTool)) {
                tempCanvas = ctx.getImageData(0, 0, canvas.width, canvas.height);
            }
            
            // Brush tool
            if (currentTool === 'brush') {
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineWidth = brushSize;
                ctx.strokeStyle = currentColor;
                ctx.globalAlpha = opacity;
            }
            
            // Eraser
            if (currentTool === 'eraser') {
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineWidth = brushSize;
                ctx.strokeStyle = 'white';
                ctx.globalAlpha = opacity;
            }
        }

        function draw(e) {
            if (!isDrawing) return;
            
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;
            
            // Update coordinates display
            document.getElementById('coordinates').textContent = `X: ${Math.floor(x)}, Y: ${Math.floor(y)}`;
            
            if (currentTool === 'spray') {
                spray(x, y);
                return;
            }
            
            if (['line', 'rect', 'circle'].includes(currentTool)) {
                // Restore original state
                ctx.putImageData(tempCanvas, 0, 0);
                
                ctx.globalAlpha = opacity;
                ctx.strokeStyle = currentColor;
                ctx.lineWidth = brushSize;
                ctx.lineCap = 'round';
                
                if (currentTool === 'line') {
                    ctx.beginPath();
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(x, y);
                    ctx.stroke();
                } else if (currentTool === 'rect') {
                    const width = x - startX;
                    const height = y - startY;
                    
                    if (fillShape) {
                        ctx.fillStyle = currentColor;
                        ctx.fillRect(startX, startY, width, height);
                    }
                    ctx.strokeRect(startX, startY, width, height);
                } else if (currentTool === 'circle') {
                    const radiusX = Math.abs(x - startX);
                    const radiusY = Math.abs(y - startY);
                    const radius = Math.max(radiusX, radiusY);
                    
                    ctx.beginPath();
                    ctx.arc(startX, startY, radius, 0, Math.PI * 2);
                    
                    if (fillShape) {
                        ctx.fillStyle = currentColor;
                        ctx.fill();
                    }
                    ctx.stroke();
                }
                
                ctx.globalAlpha = 1;
                return;
            }
            
            if (currentTool === 'brush' || currentTool === 'eraser') {
                ctx.lineTo(x, y);
                ctx.stroke();
                lastX = x;
                lastY = y;
            }
        }

        function stopDrawing() {
            if (isDrawing && ['brush', 'eraser', 'spray'].includes(currentTool)) {
                ctx.globalAlpha = 1;
                saveState();
            }
            isDrawing = false;
        }

        // Event listeners
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);
        
        // Prevent context menu
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());
        
        // Track mouse coordinates
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = Math.floor((e.clientX - rect.left) * scaleX);
            const y = Math.floor((e.clientY - rect.top) * scaleY);
            document.getElementById('coordinates').textContent = `X: ${x}, Y: ${y}`;
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'z') {
                e.preventDefault();
                undo();
            }
            if (e.ctrlKey && e.key === 'y') {
                e.preventDefault();
                redo();
            }
            if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                saveCanvas();
            }
        });

        // Fill shape toggle
        document.getElementById('fillShape').addEventListener('change', (e) => {
            fillShape = e.target.checked;
        });

        // Initialize
        initCanvas();
    </script>
</body>
</html>
